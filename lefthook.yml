# Local git hooks. See docs/architecture.md, Quality > Workflow.
# Hooks run in a non-interactive shell (also from GUI git clients) that does
# not read ~/.zshrc, so the Rust jobs add rustup's usual locations to PATH.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,json,md,css,html,yml,yaml}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx,js,mjs}'
      run: pnpm exec oxlint {staged_files}
    - name: rustfmt
      # Two globs: `**/` needs a folder, so the first one covers build.rs and
      # build_env.rs beside Cargo.toml.
      glob:
        - 'src-tauri/*.rs'
        - 'src-tauri/**/*.rs'
      run: PATH="$HOME/.cargo/bin:/opt/homebrew/opt/rustup/bin:/usr/local/opt/rustup/bin:$PATH" rustfmt --edition 2024 {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: block-main
      run: sh scripts/block-main-push.sh
      use_stdin: true
    - name: format
      run: pnpm format:check
    - name: lint
      glob:
        - '*.{ts,tsx,js,mjs,cjs,json,yml,yaml}'
        - '**/*.{ts,tsx,js,mjs,cjs,json,yml,yaml}'
      run: pnpm lint
    # The heavy steps run only when the push changes files they check: a push
    # of docs or images skips them (CI still runs what the change needs).
    # Each glob is listed with and without `**/`, which needs a folder.
    - name: typecheck
      glob:
        - '*.{ts,tsx,js,mjs,cjs,json,yml,yaml}'
        - '**/*.{ts,tsx,js,mjs,cjs,json,yml,yaml}'
      run: pnpm typecheck
    # Vitest also reads Rust sources, migrations and capabilities.
    - name: unit-tests
      glob:
        - '*.{ts,tsx,js,mjs,cjs,json,yml,yaml,css,html}'
        - '**/*.{ts,tsx,js,mjs,cjs,json,yml,yaml,css,html,rs,sql,sqlite}'
      run: pnpm test:fast
    - name: rust
      glob:
        - 'src-tauri/*.{rs,toml,json}'
        - 'src-tauri/**/*.{rs,toml,json,sql}'
        - 'src-tauri/Cargo.lock'
      run: export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/rustup/bin:/usr/local/opt/rustup/bin:$PATH" && cd src-tauri && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
