# Local git hooks. See docs/specs/quality.md, Workflow.
# Hooks run in a non-interactive shell (also from GUI git clients) that does
# not read ~/.zshrc, so the Rust jobs add rustup's usual locations to PATH.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,json,md,css,html,yml,yaml}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx,js,mjs}'
      run: pnpm exec oxlint --deny-warnings {staged_files}
    - name: rustfmt
      # Two globs: `**/` needs a folder, so the first one covers build.rs,
      # build_commands.rs and build_env.rs beside Cargo.toml.
      glob:
        - 'src-tauri/*.rs'
        - 'src-tauri/**/*.rs'
      run: PATH="$HOME/.cargo/bin:/opt/homebrew/opt/rustup/bin:/usr/local/opt/rustup/bin:$PATH" rustfmt --edition 2024 {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: block-main
      run: sh scripts/block-main-push.sh
      use_stdin: true
    - name: format
      run: sh scripts/run-if-pushing-commits.sh 'pnpm format:check'
      use_stdin: true
    - name: lint
      glob:
        - '*.{ts,tsx,js,mjs,cjs,json,yml,yaml}'
        - '**/*.{ts,tsx,js,mjs,cjs,json,yml,yaml}'
      run: sh scripts/run-if-pushing-commits.sh 'pnpm lint'
      use_stdin: true
    # The heavy steps run only when the push changes files they check: a push
    # of docs or images skips them (CI still runs what the change needs).
    # Each glob is listed with and without `**/`, which needs a folder.
    - name: typecheck
      glob:
        - '*.{ts,tsx,js,mjs,cjs,json,yml,yaml}'
        - '**/*.{ts,tsx,js,mjs,cjs,json,yml,yaml}'
      run: sh scripts/run-if-pushing-commits.sh 'pnpm typecheck'
      use_stdin: true
    # Vitest also reads Rust sources, migrations and capabilities.
    - name: unit-tests
      glob:
        - '*.{ts,tsx,js,mjs,cjs,json,yml,yaml,css,html}'
        - '**/*.{ts,tsx,js,mjs,cjs,json,yml,yaml,css,html,rs,sql,sqlite}'
      run: sh scripts/run-if-pushing-commits.sh 'pnpm test:fast'
      use_stdin: true
    # Policy and token tests read README.md, CLAUDE.md, the design notes and
    # the README images, which the unit-tests glob leaves out.
    - name: policy-tests
      glob:
        - '*.{md,png,jpg,jpeg,gif,webp,svg}'
        - '**/*.{md,png,jpg,jpeg,gif,webp,svg}'
      run: sh scripts/run-if-pushing-commits.sh 'pnpm test:policy'
      use_stdin: true
    - name: rust
      glob:
        - 'src-tauri/*.{rs,toml,json}'
        - 'src-tauri/**/*.{rs,toml,json,sql,sqlite}'
        - 'src-tauri/Cargo.lock'
      run: sh scripts/run-if-pushing-commits.sh 'export PATH="$HOME/.cargo/bin:/opt/homebrew/opt/rustup/bin:/usr/local/opt/rustup/bin:$PATH" && cd src-tauri && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test'
      use_stdin: true
