<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Devot Settings Concept</title>
    <style>
      :root {
        --wall: #dfe7ee;
        --blob-a: rgb(95 196 192 / 0.75);
        --blob-b: rgb(122 167 240 / 0.7);
        --blob-c: rgb(243 190 160 / 0.75);
        --window: rgb(244 245 248 / 0.55);
        --window-edge: rgb(0 0 0 / 0.18);
        --window-shadow: rgb(20 30 50 / 0.18);
        --sheet: rgb(255 255 255 / 0.8);
        --card: rgb(28 27 25 / 0.04);
        --card-raised: rgb(255 255 255 / 0.7);
        --glass: rgb(255 255 255 / 0.4);
        --glass-strong: rgb(255 255 255 / 0.72);
        --glass-edge: rgb(255 255 255 / 0.85);
        --glass-hi: rgb(255 255 255 / 0.95);
        --glass-shadow: rgb(20 32 50 / 0.1);
        --ink: rgb(0 0 0 / 0.86);
        --ink-2: #595959;
        --ink-3: #676767;
        --hair: rgb(0 0 0 / 0.1);
        --grid: rgb(0 0 0 / 0.07);
        --accent: #3472d6;
        --accent-text: #2856a2;
        --sel: rgb(52 114 214 / 0.13);
        --destructive: #af3b36;
        --act: #0e6b62;
        --act-0: rgb(28 27 25 / 0.07);
        --act-1: rgb(14 107 98 / 0.25);
        --act-2: rgb(14 107 98 / 0.45);
        --act-3: rgb(14 107 98 / 0.7);
        --act-4: #0e6b62;
        --up: #096848;
        --down: #94414e;
        --tip: rgb(255 255 255 / 0.86);
        --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        color-scheme: light;
      }
      .dark {
        --wall: #0e141b;
        --blob-a: rgb(20 120 118 / 0.55);
        --blob-b: rgb(52 84 170 / 0.55);
        --blob-c: rgb(120 70 60 / 0.45);
        --window: rgb(24 25 29 / 0.62);
        --window-edge: rgb(255 255 255 / 0.14);
        --window-shadow: rgb(0 0 0 / 0.5);
        --sheet: rgb(30 30 34 / 0.82);
        --card: rgb(235 232 226 / 0.05);
        --card-raised: rgb(255 255 255 / 0.06);
        --glass: rgb(255 255 255 / 0.07);
        --glass-strong: rgb(60 60 66 / 0.62);
        --glass-edge: rgb(255 255 255 / 0.14);
        --glass-hi: rgb(255 255 255 / 0.16);
        --glass-shadow: rgb(0 0 0 / 0.35);
        --ink: rgb(255 255 255 / 0.9);
        --ink-2: #a3a3a3;
        --ink-3: #909090;
        --hair: rgb(255 255 255 / 0.1);
        --grid: rgb(255 255 255 / 0.07);
        --accent: #4576b2;
        --accent-text: #7ea6d8;
        --sel: rgb(91 155 255 / 0.2);
        --destructive: #f0a6a2;
        --act: #63cdbf;
        --act-0: rgb(235 232 226 / 0.08);
        --act-1: rgb(99 205 191 / 0.22);
        --act-2: rgb(99 205 191 / 0.42);
        --act-3: rgb(99 205 191 / 0.66);
        --act-4: #63cdbf;
        --up: #10b77f;
        --down: #fb7085;
        --tip: rgb(44 44 48 / 0.88);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        background: var(--wall);
        color: var(--ink);
        font: 13px/1.45 var(--font);
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        position: relative;
        overflow-x: hidden;
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: default;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .blob {
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
      }
      .blob.a {
        left: -160px;
        top: -180px;
        width: 720px;
        height: 620px;
        background: var(--blob-a);
        filter: blur(100px);
      }
      .blob.b {
        right: -200px;
        top: 140px;
        width: 760px;
        height: 640px;
        background: var(--blob-b);
        filter: blur(120px);
      }
      .blob.c {
        left: 30%;
        bottom: -300px;
        width: 820px;
        height: 520px;
        background: var(--blob-c);
        filter: blur(120px);
      }

      .review {
        position: relative;
        max-width: 1160px;
        margin: 0 auto;
        padding: 20px 24px 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 11px;
        color: var(--ink-2);
      }
      .review .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--glass-strong);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 0 0 0.5px var(--glass-edge);
      }
      .review .switches {
        display: flex;
        gap: 6px;
      }
      .chip {
        height: 26px;
        padding: 0 12px;
        border-radius: 13px;
        border: 0;
        background: var(--glass-strong);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 0 0 0.5px var(--glass-edge),
          0 1px 6px var(--glass-shadow);
        font-size: 11px;
        backdrop-filter: blur(20px) saturate(1.8);
      }
      .chip[aria-pressed='true'] {
        color: var(--accent-text);
        font-weight: 600;
      }

      .frame {
        position: relative;
        max-width: 1160px;
        margin: 16px auto 40px;
        padding: 0 24px;
      }
      .window {
        position: relative;
        border-radius: 26px;
        overflow: hidden;
        background: var(--window);
        backdrop-filter: blur(60px) saturate(1.6);
        -webkit-backdrop-filter: blur(60px) saturate(1.6);
        box-shadow:
          0 0 0 0.5px var(--window-edge),
          0 30px 80px var(--window-shadow),
          0 8px 24px var(--window-shadow);
        display: flex;
        min-height: 900px;
      }
      .window::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--sheet);
      }

      /* Floating glass sidebar, as in the Settings design */
      .sidebar {
        position: relative;
        z-index: 1;
        flex: none;
        width: 216px;
        margin: 8px;
        border-radius: 18px;
        padding: 0 8px 8px;
        background: var(--glass);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 0 0 0.5px var(--glass-edge),
          0 10px 30px var(--glass-shadow);
        backdrop-filter: blur(32px) saturate(1.9);
        -webkit-backdrop-filter: blur(32px) saturate(1.9);
        align-self: stretch;
      }
      .lights {
        display: flex;
        gap: 9px;
        height: 44px;
        align-items: center;
        padding-left: 10px;
      }
      .lights i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ff5f57;
        box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / 0.12);
      }
      .lights i:nth-child(2) {
        background: #febc2e;
      }
      .lights i:nth-child(3) {
        background: #28c840;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 32px;
        margin: 0 0 10px;
        padding: 0 11px;
        border-radius: 16px;
        background: var(--glass-strong);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 0 0 0.5px var(--glass-edge);
        color: var(--ink-2);
      }
      .search input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: none;
        outline: none;
        font: inherit;
        color: var(--ink);
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 32px;
        padding: 0 8px;
        border-radius: 10px;
        color: var(--ink);
        text-decoration: none;
      }
      .nav a[aria-current='page'] {
        background: var(--sel);
      }
      .tile {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--t);
        color: #fff;
        box-shadow: inset 0 0.5px 0 rgb(255 255 255 / 0.35);
      }
      .tile svg {
        width: 14px;
        height: 14px;
      }

      /* Content on the sheet */
      main {
        position: relative;
        z-index: 1;
        flex: 1;
        min-width: 0;
        padding: 0 28px 32px;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 52px;
        margin: 0 -28px;
        padding: 0 16px;
      }
      .toolbar::before {
        content: '';
        position: absolute;
        inset: 0 0 -20px;
        background: linear-gradient(var(--sheet) 40%, transparent);
        backdrop-filter: blur(4px);
        -webkit-mask-image: linear-gradient(#000 50%, transparent);
        mask-image: linear-gradient(#000 50%, transparent);
        pointer-events: none;
        z-index: -1;
      }
      .hist {
        display: flex;
        height: 32px;
        border-radius: 16px;
        overflow: hidden;
        background: var(--glass-strong);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 0 0 0.5px var(--glass-edge),
          0 1px 8px var(--glass-shadow);
        backdrop-filter: blur(20px) saturate(1.8);
      }
      .hist button {
        width: 36px;
        border: 0;
        background: none;
        display: grid;
        place-items: center;
        color: var(--ink-2);
      }
      .hist button:disabled {
        opacity: 0.4;
      }
      .hist i {
        width: 0.5px;
        margin: 8px 0;
        background: var(--hair);
      }
      .toolbar h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        transition: opacity 0.18s;
      }
      .redesign .toolbar h1 {
        opacity: 0;
      }
      .redesign.scrolled .toolbar h1,
      .redesign.searching .toolbar h1 {
        opacity: 1;
      }

      .privacy {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0 18px;
        color: var(--ink-2);
        font-size: 12px;
      }
      .privacy svg {
        flex: none;
        color: var(--act);
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        margin-bottom: 14px;
      }
      .segmented {
        display: flex;
        height: 32px;
        padding: 3px;
        border-radius: 16px;
        background: var(--glass-strong);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 0 0 0.5px var(--glass-edge),
          0 1px 8px var(--glass-shadow);
        backdrop-filter: blur(20px) saturate(1.8);
      }
      .segmented button {
        min-width: 72px;
        border: 0;
        border-radius: 13px;
        background: transparent;
        color: var(--ink-2);
        font-size: 12px;
        font-weight: 500;
      }
      .segmented button[aria-pressed='true'] {
        background: var(--card-raised);
        color: var(--ink);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 1px 4px var(--glass-shadow);
      }
      .dark .segmented button[aria-pressed='true'] {
        background: rgb(110 110 118 / 0.55);
      }
      .range {
        color: var(--ink-2);
        font-size: 12px;
      }
      .popup {
        margin-left: auto;
        position: relative;
        display: flex;
        align-items: center;
      }
      .popup select {
        appearance: none;
        -webkit-appearance: none;
        height: 28px;
        padding: 0 30px 0 12px;
        border: 0;
        border-radius: 14px;
        background: var(--card);
        box-shadow: 0 0 0 0.5px var(--hair);
        font-size: 12px;
      }
      .popup svg {
        position: absolute;
        right: 10px;
        pointer-events: none;
        color: var(--ink-2);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .stat {
        border-radius: 18px;
        background: var(--card);
        padding: 16px 18px 14px;
        min-width: 0;
      }
      .stat .label {
        font-size: 12px;
        color: var(--ink-2);
      }
      .stat .value {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin: 4px 0 2px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.6px;
        line-height: 1.15;
      }
      .stat .value small {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0;
        color: var(--ink-2);
      }
      .delta {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        color: var(--ink-2);
      }
      .delta b {
        font-weight: 600;
      }
      .delta.up b {
        color: var(--up);
      }
      .delta.down b {
        color: var(--down);
      }
      .spark {
        display: block;
        width: 100%;
        height: 26px;
        margin-top: 10px;
      }
      .days {
        display: grid;
        grid-template-columns: repeat(30, minmax(0, 1fr));
        gap: 2px;
        margin-top: 12px;
        height: 26px;
        align-items: end;
      }
      .days span {
        height: 10px;
        border-radius: 2px;
        background: var(--act-0);
      }
      .days span.on {
        background: var(--act-3);
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin: 0 4px 8px;
      }
      h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .section-head span {
        font-size: 11px;
        color: var(--ink-2);
      }
      .card {
        border-radius: 18px;
        background: var(--card);
        padding: 16px 18px;
        margin-bottom: 8px;
      }
      .chart-title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 10px;
        font-size: 12px;
      }
      .chart-title b {
        font-weight: 600;
      }
      .chart-title span {
        color: var(--ink-2);
        font-size: 11px;
      }
      .footnote {
        margin: 0 4px 22px;
        font-size: 11px;
        color: var(--ink-2);
      }

      .plot {
        position: relative;
      }
      .plot svg {
        display: block;
        width: 100%;
        overflow: visible;
      }
      .plot .grid line {
        stroke: var(--grid);
        stroke-width: 1;
      }
      .plot text {
        fill: var(--ink-3);
        font-size: 10px;
        font-family: var(--font);
      }
      .col {
        fill: var(--act);
        opacity: 0.85;
        transition: opacity 0.12s;
      }
      .col.zero {
        fill: var(--act-0);
        opacity: 1;
      }
      .col.dim {
        opacity: 0.35;
      }
      .col.hot {
        opacity: 1;
      }
      .avg {
        stroke: var(--ink-3);
        stroke-width: 1;
      }
      .avg-key {
        display: inline-block;
        width: 14px;
        height: 1px;
        background: var(--ink-3);
        vertical-align: middle;
        margin-right: 6px;
      }
      .hit {
        fill: transparent;
      }

      .heat {
        display: grid;
        grid-template-columns: 30px repeat(24, minmax(0, 1fr));
        gap: 3px;
        align-items: center;
      }
      .heat .d {
        font-size: 10px;
        color: var(--ink-3);
      }
      .heat .h {
        font-size: 10px;
        color: var(--ink-3);
        text-align: left;
        padding-top: 3px;
        white-space: nowrap;
      }
      .cell {
        aspect-ratio: 1.25;
        min-height: 12px;
        border: 0;
        padding: 0;
        border-radius: 4px;
        background: var(--act-0);
      }
      .cell[data-l='1'] {
        background: var(--act-1);
      }
      .cell[data-l='2'] {
        background: var(--act-2);
      }
      .cell[data-l='3'] {
        background: var(--act-3);
      }
      .cell[data-l='4'] {
        background: var(--act-4);
      }
      .cell:hover,
      .cell:focus-visible {
        box-shadow:
          0 0 0 2px var(--sheet),
          0 0 0 3.5px var(--ink-2);
        outline: none;
      }
      .heat-foot {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin: 12px 0 0 33px;
        font-size: 11px;
        color: var(--ink-2);
      }
      .peak b {
        color: var(--ink);
        font-weight: 600;
      }
      .key {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .key i {
        width: 12px;
        height: 10px;
        border-radius: 3px;
        display: inline-block;
      }
      .key span {
        margin: 0 4px;
      }
      .divider {
        height: 0.5px;
        background: var(--hair);
        margin: 18px 0 16px;
      }

      .types {
        padding: 4px 18px;
      }
      .type {
        display: grid;
        grid-template-columns: 22px 140px minmax(0, 1fr) 54px 40px;
        gap: 12px;
        align-items: center;
        padding: 12px 0;
      }
      .type + .type {
        border-top: 0.5px solid var(--hair);
      }
      .type svg {
        color: var(--ink-2);
      }
      .track {
        height: 6px;
        border-radius: 3px;
        background: var(--act-0);
        overflow: hidden;
      }
      .track i {
        display: block;
        height: 100%;
        border-radius: 3px;
        background: var(--act);
      }
      .type .n {
        text-align: right;
        font-weight: 500;
      }
      .type .pct {
        text-align: right;
        color: var(--ink-2);
        font-size: 11px;
      }

      .storage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px 20px;
        align-items: center;
      }
      .storage .title {
        font-weight: 500;
      }
      .storage .sub {
        font-size: 11px;
        color: var(--ink-2);
        margin-top: 2px;
      }
      .meter {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        color: var(--ink-2);
      }
      .meter .bar {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: var(--act-0);
        overflow: hidden;
      }
      .meter .bar i {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 3px;
      }
      .buttons {
        display: flex;
        gap: 8px;
      }
      .button {
        height: 28px;
        padding: 0 14px;
        border: 0;
        border-radius: 14px;
        background: var(--glass-strong);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 0 0 0.5px var(--hair),
          0 1px 3px var(--glass-shadow);
        font-size: 12px;
        white-space: nowrap;
      }
      .button:active {
        transform: scale(0.96);
      }
      .button.danger {
        color: var(--destructive);
      }

      .events {
        margin-top: 10px;
        border-radius: 14px;
        background: var(--card-raised);
        box-shadow: 0 0 0 0.5px var(--hair);
        overflow: hidden;
      }
      .events table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .events th {
        text-align: left;
        font-weight: 500;
        color: var(--ink-2);
        font-size: 11px;
        padding: 8px 14px;
        border-bottom: 0.5px solid var(--hair);
      }
      .events td {
        padding: 7px 14px;
        border-bottom: 0.5px solid var(--hair);
      }
      .events tr:last-child td {
        border-bottom: 0;
      }
      .events td:first-child {
        color: var(--ink-2);
        width: 45%;
      }

      .empty {
        display: none;
        text-align: center;
        padding: 30px 16px 26px;
      }
      .empty svg {
        color: var(--act);
      }
      .empty h3 {
        margin: 10px 0 4px;
        font-size: 13px;
        font-weight: 600;
      }
      .empty p {
        margin: 0;
        font-size: 12px;
        color: var(--ink-2);
      }
      .sparse .empty {
        display: block;
      }
      .sparse .has-data {
        display: none;
      }

      .tip {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        padding: 7px 10px;
        border-radius: 12px;
        background: var(--tip);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 0 0 0.5px var(--glass-edge),
          0 8px 24px var(--glass-shadow);
        backdrop-filter: blur(20px) saturate(1.8);
        -webkit-backdrop-filter: blur(20px) saturate(1.8);
        font-size: 11px;
        color: var(--ink-2);
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 0.12s,
          transform 0.12s;
        white-space: nowrap;
      }
      .tip.on {
        opacity: 1;
        transform: none;
      }
      .tip b {
        display: block;
        color: var(--ink);
        font-size: 13px;
        font-weight: 600;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @media (max-width: 900px) {
        .sidebar {
          display: none;
        }
        .window {
          border-radius: 22px;

      .switch {

      .seg {

      .link {

      .button.primary {

          desc: 'Plugins add commands, menu items, shortcuts, preview drawings and file formats. Each runs apart from your notes, with no network access.',

      const NAV_GROUPS = [

      const NAV_LABELS = [null, 'Your Notes, Elsewhere', 'AI & Extensions', 'Privacy']
      const byId = Object.fromEntries(PANES.map((p) => [p.id, p]))
      const tile = (p, cls = '') =>
        `<span class="tile ${cls}" style="--t:${p.color}${p.dark ? ';color:#1d1d1f' : ''}">${svg(p.id, 14, 2)}</span>`

      function renderNav(current) {
        $('#nav').innerHTML = NAV_GROUPS.map(
          (g, i) =>
            `${NAV_LABELS[i] ? `<div class="group-label">${NAV_LABELS[i]}</div>` : ''}<ul class="nav">${g
              .map((id) => {
                const p = byId[id]
                return `<li><a href="#${id}" data-pane="${id}" ${id === current ? 'aria-current="page"' : ''}>${tile(p)}${p.short || p.title}</a></li>`
              })
              .join('')}</ul>`,

      function rowHtml(r) {
        if (!Array.isArray(r)) return `<div class="block">${r.html}</div>`

          )
          .join('')
      }
      const head = (p) =>
        `<div class="pane-head">${tile(p)}<div><h2>${p.title}</h2><p>${p.desc}</p></div></div>`

      const CUSTOM = {
        keyboard() {

        license() {
          return (
            `<div class="hero" style="display:block"><div style="display:flex;align-items:center;gap:14px"><span class="big" style="background:var(--sel);color:var(--accent-text)">${svg('license', 22)}</span><div class="grow"><b>Trial · 9 days left</b><small>Everything works, sync and AI included, until Nov 10, 2026.</small></div>${btn('Buy a License', 'primary')}</div><div class="trial-meter" role="meter" aria-label="Trial used" aria-valuenow="5" aria-valuemax="14"><i></i></div></div>` +
            groupsHtml([
              {

                rows: [

                    `<div class="range-row">${field('devot1…', '', 'text', 'mono')}${btn('Add License')}</div>`,

      let hist = ['general'],
        at = 0
      function show(id, push = true, focusLabel) {
        const p = byId[id]
        if (push) {
          hist = hist.slice(0, at + 1)
          hist.push(id)
          at = hist.length - 1
        }
        $('#title').textContent = p.title
        renderNav(id)
        $('#pane').style.animation = 'none'
        void $('#pane').offsetWidth
        $('#pane').style.animation = ''
        $('#pane').innerHTML = head(p) + (p.custom ? CUSTOM[p.custom]() : groupsHtml(p.groups))
        $('#back').disabled = at === 0
        $('#fwd').disabled = at === hist.length - 1
        wire(id)
        if (focusLabel) {
          const r = [...document.querySelectorAll('#pane .row')].find(
            (x) => x.dataset.label === focusLabel,
          )
          if (r) {
            r.scrollIntoView({ block: 'center', behavior: 'smooth' })
            r.classList.add('hit')
          }
        } else window.scrollTo({ top: 0 })
      }

      function wire(id) {
        document
          .querySelectorAll('#pane .switch')
          .forEach((s) =>
            s.addEventListener('click', () =>
              s.setAttribute('aria-checked', String(s.getAttribute('aria-checked') !== 'true')),
            ),
          )
        document.querySelectorAll('#pane .seg').forEach((g) =>
          g.querySelectorAll('button').forEach((b) =>
            b.addEventListener('click', () =>
              g.querySelectorAll('button').forEach((x) => {
                x.setAttribute('aria-pressed', String(x === b))
                x.setAttribute('aria-checked', String(x === b))
              }),
            ),
          ),
        )
        document
          .querySelectorAll('#pane .choice-items, #pane .themes')
          .forEach((g) =>
            g
              .querySelectorAll('.pic')
              .forEach((b) =>
                b.addEventListener('click', () =>
                  g
                    .querySelectorAll('.pic')
                    .forEach((x) => x.setAttribute('aria-pressed', String(x === b))),
                ),
              ),
          )
        document.querySelectorAll('#pane .stepper').forEach((s) => {
          const o = s.querySelector('output'),
            u = o.dataset.unit,
            inc = +s.dataset.inc
          s.querySelectorAll('button').forEach((b, i) =>
            b.addEventListener('click', () => {
              let v = parseFloat(o.textContent) + (i ? inc : -inc)
              v = Math.min(+s.dataset.max, Math.max(+s.dataset.min, v))
              o.innerHTML = (inc < 1 ? v.toFixed(1) : v) + (u ? `<small> ${u}</small>` : '')
            }),
          )
        })
        document.querySelectorAll('#pane input[type=range]').forEach((r) =>
          r.addEventListener('input', () => {
            r.style.setProperty('--p', (+r.value + 100) / 2 + '%')
            r.nextElementSibling.textContent = (r.value > 0 ? '+' : '') + r.value
          }),
        )
        if (id === 'keyboard') {
          $('#kbq').addEventListener('input', (e) => {
            const q = e.target.value
              .toLowerCase()
              .replace(/cmd|command/g, '⌘')
              .replace(/shift/g, '⇧')
              .replace(/opt(ion)?|alt/g, '⌥')
              .replace(/ctrl|control/g, '⌃')
              .replace(/[\s+]/g, '')
            document.querySelectorAll('#pane .row.kb').forEach((r) => {
              r.hidden =
                !!q &&
                !r.dataset.label.toLowerCase().includes(q) &&
                !r.dataset.keys.toLowerCase().includes(q)
            })
          })
          document.querySelectorAll('#pane .keys').forEach((k) =>
            k.addEventListener('click', () => {
              const old = k.innerHTML
              k.innerHTML = '<span class="kbd recording">Type shortcut…</span>'
              setTimeout(() => (k.innerHTML = old), 1600)
            }),
          )
        }
        if (id === 'integrations') {
          const CFG = [
            [
              'Run this command in Terminal.',
              'claude mcp add devot -- node ~/Code/devot/dist-mcp/devot-mcp.mjs',
            ],
            [
              'Add this to ~/.codex/config.toml.',
              '[mcp_servers.devot]\ncommand = "node"\nargs = ["~/Code/devot/dist-mcp/devot-mcp.mjs"]',
            ],
            [
              'Add this to the client’s MCP configuration file (mcpServers).',
              '{\n  "mcpServers": {\n    "devot": { "command": "node", "args": ["~/Code/devot/dist-mcp/devot-mcp.mjs"] }\n  }\n}',
            ],
          ]
          document.querySelectorAll('#pane [data-tab]').forEach((t) =>
            t.addEventListener('click', () => {
              document
                .querySelectorAll('#pane [data-tab]')
                .forEach((x) => x.setAttribute('aria-selected', String(x === t)))
              const [h, c] = CFG[+t.dataset.tab]
              $('#cfg-hint').textContent = h
              $('#cfg').firstChild.textContent = c
            }),
          )
          $('#copy').addEventListener('click', (e) => {
            e.target.textContent = 'Copied'
            setTimeout(() => (e.target.textContent = 'Copy'), 1200)
          })
        }
        if (id === 'usage') initUsage()
      }

      // search across every pane
      function index() {
        const out = []
        for (const p of PANES) {
          out.push({ pane: p.id, label: p.title, kind: 'pane' })
          for (const g of p.groups || [])
            for (const r of g.rows) {
              if (Array.isArray(r)) out.push({ pane: p.id, label: r[0], hint: r[1] })
              else if (r.keys)
                out.push({
                  pane: p.id,
                  label: r.keys.split(' ').slice(0, 2).join(' '),
                  hint: r.keys,
                })
            }
        }
        const extra = {
          keyboard: ['Keyboard Shortcuts', 'Reset All'],
          mirror: ['Choose Folder', 'Include Attachments'],
          sync: [
            'Sync This Device',
            'Add a Device',
            'Relay Address',
            'Recovery Key',
            'Join With a Code',
            'Set Up a New Vault',
          ],
          integrations: ['AI Access', 'Claude Code', 'Codex', 'MCP'],
          plugins: ['Install from Folder', 'Install from Archive'],
          usage: ['Usage Data', 'Clear Usage Data', 'Show Events'],
          license: ['License Key', 'Buy a License', 'Trial'],
        }
        for (const [pane, labels] of Object.entries(extra))
          for (const label of labels) out.push({ pane, label })
        return out
      }
      const IDX = index()
      $('#q').addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase()
        if (!q) {
          document.body.classList.remove('searching')
          show(hist[at], false)
          return
        }
        const hits = IDX.filter(
          (x) => x.label.toLowerCase().includes(q) || (x.hint || '').toLowerCase().includes(q),
        )
        const mark = (s) =>
          esc(s).replace(
            new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig'),
            '<mark>$1</mark>',
          )
        const grouped = {}
        hits.forEach((h) => (grouped[h.pane] ||= []).push(h))
        document.body.classList.add('searching')
        $('#title').textContent = 'Search Results'
        $('#pane').innerHTML = `<div class="results">${
          hits.length
            ? Object.entries(grouped)
                .map(
                  ([pane, hs]) =>
                    `<h3>${byId[pane].title}</h3>${hs.map((h) => `<button class="result" data-pane="${pane}" data-label="${esc(h.label)}">${tile(byId[pane])}<span>${mark(h.label)}</span><small>${byId[pane].short || byId[pane].title}</small></button>`).join('')}`,
                )
                .join('')
            : '<div class="empty-state"><b>No settings match</b><p>Try another word, such as font, sync or shortcut.</p></div>'
        }</div>`
        document.querySelectorAll('.result').forEach((r) =>
          r.addEventListener('click', () => {
            $('#q').value = ''
            document.body.classList.remove('searching')
            show(r.dataset.pane, true, r.dataset.label)
          }),
        )
      })

      document.addEventListener('click', (e) => {
        const a = e.target.closest('[data-pane]')
        if (a && !a.classList.contains('result')) {
          e.preventDefault()
          $('#q').value = ''
          show(a.dataset.pane)
        }
      })
      addEventListener('scroll', () => document.body.classList.toggle('scrolled', scrollY > 90), {
        passive: true,
      })
      $('#back').addEventListener('click', () => {
        if (at > 0) {
          at--
          show(hist[at], false)
        }
      })
      $('#fwd').addEventListener('click', () => {
        if (at < hist.length - 1) {
          at++
          show(hist[at], false)
        }
      })
      $('#theme').addEventListener('click', (e) => {
        const on = document.documentElement.classList.toggle('dark')
        e.target.setAttribute('aria-pressed', String(on))
      })
      if (matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark')
        $('#theme').setAttribute('aria-pressed', 'true')
      }

      const TYPES = [
        {
          name: 'Notes created',
          icon: '<path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 3.6a2 2 0 0 1 2.8 2.8L12 15.6 8.5 16.5l.9-3.5z"/>',
        },
        {
          name: 'Searches run',
          icon: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
        },
        { name: 'Imports finished', icon: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>' },
      ]

      const END = new Date(2026, 10, 1)
      const fmt = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' })
      const fmtLong = new Intl.DateTimeFormat('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric',
      })
      const nf = new Intl.NumberFormat('en-US')
      const WEEK = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
      let days = 30,
        sparse = false,
        filter = 'all'

      // Deterministic sample data: weekday evenings busiest, some days off.
      function dayWeight(i) {
        return i % 9 === 0 || i % 11 === 0 ? 0 : 1 + ((i * 17 + i * i * 3) % 27)
      }
      function sample(n) {
        if (sparse)
          return {
            daily: Array.from({ length: n }, (_, i) => (i === n - 1 ? [1, 0, 0] : [0, 0, 0])),
          }
        const daily = []
        for (let i = 0; i < n; i++) {
          const w = dayWeight(i + (90 - n))
          daily.push(
            w
              ? [Math.round(w * 0.2 + (i % 3)), Math.round(w * 0.78), i % 13 === 4 ? 1 : 0]
              : [0, 0, 0],
          )
        }
        return { daily }
      }
      function hourWeight(d, h) {
        if (sparse) return d === 6 && h === 10 ? 1 : 0
        if (h < 7) return h === 0 && d === 4 ? 1 : 0
        if (h >= 18 && h < 23 && d < 5) return 6 + (((d * 24 + h) * 7) % 10)
        if (h >= 9 && h < 17) return ((d * 24 + h) * 13) % 6
        return ((d * 24 + h) * 3) % 4
      }

      function pick(row) {
        return filter === 'all' ? row[0] + row[1] + row[2] : row[Number(filter)]
      }
      function delta(now, before, unit) {
        if (!before) return `<span>No earlier ${unit}</span>`
        const p = Math.round(((now - before) / before) * 100)
        const cls = p > 0 ? 'up' : p < 0 ? 'down' : ''
        const sign = p > 0 ? '+' : p < 0 ? '−' : ''
        return `<span class="delta ${cls}"><b>${sign}${Math.abs(p)}%</b>&nbsp;vs previous ${days} days</span>`
      }

      function render() {
        document.body.classList.toggle('sparse', sparse)
        const { daily } = sample(days)
        const prev = sparse ? null : sample(Math.min(days * 2, 90)).daily.slice(0, days)
        const series = daily.map(pick)
        const total = series.reduce((a, b) => a + b, 0)
        const prevTotal = prev
          ? prev.map(pick).reduce((a, b) => a + b, 0) * (days === 90 ? 0.86 : 1)
          : 0
        const start = new Date(END)
        start.setDate(END.getDate() - days + 1)
        $('#range').textContent = `${fmt.format(start)} – ${fmt.format(END)}, 2026`
        $('#total-label').textContent = filter === 'all' ? 'Events' : TYPES[Number(filter)].name
        $('#total').textContent = nf.format(total)
        $('#total-delta').outerHTML =
          `<div class="delta" id="total-delta">${delta(total, Math.round(prevTotal), 'period')}</div>`
        const active = series.filter((v) => v > 0).length
        $('#active').innerHTML = `${active}<small>of ${days}</small>`
        $('#active-note').textContent = sparse
          ? 'Today'
          : `${Math.round((active / days) * 100)}% of days`
        const notes = daily.reduce((a, r) => a + r[0], 0)
        const prevNotes = prev ? prev.reduce((a, r) => a + r[0], 0) : 0
        $('#notes').textContent = nf.format(notes)
        $('#notes-delta').outerHTML =
          `<div class="delta" id="notes-delta">${delta(notes, prevNotes, 'period')}</div>`

        // Sparkline: the period in the activity hue
        const sMax = Math.max(...series, 1)
        const pts = series.map(
          (v, i) => `${(i / (series.length - 1)) * 200},${24 - (v / sMax) * 20}`,
        )
        $('#spark').innerHTML =
          `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--act)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`
        // Active days strip (last 30 of the period)
        const strip = series.slice(-30)
        $('#days').innerHTML = strip.map((v) => `<span class="${v ? 'on' : ''}"></span>`).join('')
        $('#days').style.gridTemplateColumns = `repeat(${strip.length}, minmax(0, 1fr))`

        $('#activity-caption').textContent =
          `${nf.format(total)} ${filter === 'all' ? 'events' : TYPES[Number(filter)].name.toLowerCase()}`
        const avg = total / days
        $('#avg-caption').innerHTML =
          `<span class="avg-key" aria-hidden="true"></span>Average ${avg < 10 ? avg.toFixed(1) : Math.round(avg)} a day`
        drawDaily(series, start)
        drawHeat(total)
        drawTypes(daily)
        $('#stored').textContent = sparse ? '1 event' : '1,264 events'
        const used = sparse ? 1 : 1264
        $('#meter i').style.width = `${Math.max((used / 10000) * 100, 0.6)}%`
        $('#meter').setAttribute('aria-valuenow', used)
        $('#meter-label').textContent = `${nf.format(used)} of 10,000`
        $('#events').innerHTML =
          `<table><thead><tr><th scope="col">Time</th><th scope="col">Event</th></tr></thead><tbody>
    <tr><td>Nov 1, 2026 at 10:24 AM</td><td>Note created</td></tr>
    <tr><td>Nov 1, 2026 at 10:02 AM</td><td>Search run</td></tr>
    <tr><td>Oct 31, 2026 at 9:41 PM</td><td>Search run</td></tr>
    <tr><td>Oct 31, 2026 at 9:17 PM</td><td>Import finished</td></tr></tbody></table>`
      }

      function niceMax(v) {
        if (v <= 4) return 4
        const p = 10 ** Math.floor(Math.log10(v))
        const n = v / p
        return [1.2, 1.6, 2, 3, 4, 5, 6, 8, 10].find((s) => n <= s) * p
      }

      function drawDaily(series, start) {
        const W = 1000,
          H = 150,
          L = 30,
          B = 22,
          T = 8
        const max = niceMax(Math.max(...series, 1))
        const n = series.length,
          band = (W - L) / n,
          bw = Math.min(band - 2, 24)
        const y = (v) => T + (H - T - B) * (1 - v / max)
        let g = '<g class="grid">'
        for (const t of [0, max / 2, max])
          g += `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${nf.format(t)}</text>`
        g += '</g>'
        const avg = series.reduce((a, b) => a + b, 0) / n
        let bars = ''
        series.forEach((v, i) => {
          const x = L + i * band + (band - bw) / 2
          const h = v ? Math.max(y(0) - y(v), 2) : 2
          const r = Math.min(4, bw / 2, h)
          const top = y(0) - h
          const d = `M${x},${y(0)}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${y(0)}Z`
          const date = new Date(start)
          date.setDate(start.getDate() + i)
          bars += `<path class="col ${v ? '' : 'zero'}" data-i="${i}" d="${d}"/>`
          bars += `<rect class="hit" x="${L + i * band}" y="${T}" width="${band}" height="${H - T - B}" data-i="${i}" data-label="${fmtLong.format(date)}" data-v="${v}"/>`
        })
        const ticks = [0, Math.floor((n - 1) / 2), n - 1]
          .map((i) => {
            const date = new Date(start)
            date.setDate(start.getDate() + i)
            const x = L + i * band + band / 2
            const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'
            return `<text x="${i === 0 ? L : i === n - 1 ? W : x}" y="${H - 6}" text-anchor="${anchor}">${fmt.format(date)}</text>`
          })
          .join('')
        const avgLine = avg
          ? `<line class="avg" x1="${L}" x2="${W}" y1="${y(avg)}" y2="${y(avg)}"/>`
          : ''
        $('#daily').innerHTML =
          `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Events by day, ${n} days">${g}${bars}${avgLine}${ticks}</svg>`
        const svg = $('#daily svg'),
          cols = svg.querySelectorAll('.col')
        svg.querySelectorAll('.hit').forEach((h) => {
          h.addEventListener('pointerenter', (e) => {
            cols.forEach((c) => c.classList.toggle('dim', c.dataset.i !== h.dataset.i))
            cols[h.dataset.i].classList.add('hot')
            tip(
              e,
              h.dataset.label,
              `${nf.format(h.dataset.v)} ${Number(h.dataset.v) === 1 ? 'event' : 'events'}`,
            )
          })
          h.addEventListener('pointermove', move)
          h.addEventListener('pointerleave', () => {
            cols.forEach((c) => c.classList.remove('dim', 'hot'))
            hide()
          })
        })
      }

      function drawHeat(total) {
        const w = []
        for (let d = 0; d < 7; d++) for (let h = 0; h < 24; h++) w.push(hourWeight(d, h))
        const ws = w.reduce((a, b) => a + b, 0) || 1
        const c = w.map((v) => Math.round((v / ws) * total))
        const max = Math.max(...c, 1)
        let out = ''
        for (let d = 0; d < 7; d++) {
          out += `<span class="d" role="rowheader">${WEEK[d]}</span>`
          for (let h = 0; h < 24; h++) {
            const n = c[d * 24 + h]
            const l = n ? Math.max(1, Math.ceil((n / max) * 4)) : 0
            const label = `${WEEK[d]} ${String(h).padStart(2, '0')}:00–${String(h + 1).padStart(2, '0')}:00`
            out += `<button class="cell" role="gridcell" data-l="${l}" data-label="${label}" data-v="${n}" aria-label="${label}, ${n} events"></button>`
          }
        }
        out += '<span></span>'
        for (let h = 0; h < 24; h++)
          out += `<span class="h">${h % 6 === 0 ? String(h).padStart(2, '0') + ':00' : ''}</span>`
        $('#heat').innerHTML = out
        $('#heat')
          .querySelectorAll('.cell')
          .forEach((b) => {
            const show = (e) =>
              tip(e, b.dataset.label, `${b.dataset.v} ${b.dataset.v === '1' ? 'event' : 'events'}`)
            b.addEventListener('pointerenter', show)
            b.addEventListener('pointermove', move)
            b.addEventListener('pointerleave', hide)
            b.addEventListener('focus', () => {
              const r = b.getBoundingClientRect()
              tip(
                { clientX: r.left + r.width / 2, clientY: r.top },
                b.dataset.label,
                `${b.dataset.v} events`,
              )
            })
            b.addEventListener('blur', hide)
          })
        const weekdayEvenings = [0, 1, 2, 3, 4].reduce(
          (a, d) => a + c.slice(d * 24 + 18, d * 24 + 23).reduce((x, y) => x + y, 0),
          0,
        )
        $('#peak').innerHTML = total
          ? `Busiest: <b>weekday evenings</b>, ${Math.round((weekdayEvenings / total) * 100)}% of events between 18:00 and 23:00`
          : ''
      }

      function drawTypes(daily) {
        const counts = [0, 1, 2].map((t) => daily.reduce((a, r) => a + r[t], 0))
        const sum = counts.reduce((a, b) => a + b, 0) || 1
        $('#types').innerHTML = TYPES.map(
          (t, i) => `<div class="type">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${t.icon}</svg>
    <span>${t.name}</span>
    <div class="track" aria-hidden="true"><i style="width:${(counts[i] / sum) * 100}%"></i></div>
    <span class="n">${nf.format(counts[i])}</span>
    <span class="pct">${counts[i] && counts[i] / sum < 0.01 ? '<1' : Math.round((counts[i] / sum) * 100)}%</span></div>`,
        ).join('')
      }

      const tipEl = $('#tip')
      function tip(e, title, body) {
        tipEl.innerHTML = `<b>${body}</b>${title}`
        tipEl.classList.add('on')
        move(e)
      }
      function move(e) {
        const r = tipEl.getBoundingClientRect()
        let x = e.clientX - r.width / 2,
          y = e.clientY - r.height - 12
        x = Math.max(8, Math.min(innerWidth - r.width - 8, x))
        if (y < 8) y = e.clientY + 16
        tipEl.style.left = x + 'px'
        tipEl.style.top = y + 'px'
      }
      function hide() {
        tipEl.classList.remove('on')
      }

      function initUsage() {
        document.querySelectorAll('[data-days]').forEach((b) =>
          b.addEventListener('click', () => {
            days = Number(b.dataset.days)
            document
              .querySelectorAll('[data-days]')
              .forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
            render()
          }),
        )
        $('#filter').addEventListener('change', (e) => {
          filter = e.target.value
          render()
        })
        $('#show').addEventListener('click', (e) => {
          const el = $('#events')
          el.hidden = !el.hidden
          e.target.setAttribute('aria-expanded', String(!el.hidden))
          e.target.textContent = el.hidden ? 'Show Events' : 'Hide Events'
        })
        $('#clear').addEventListener('click', (e) => {
          e.target.textContent = 'Preview only'
          setTimeout(() => (e.target.textContent = 'Clear Usage Data…'), 1400)
        })
        days = 30
        filter = 'all'
        render()
      }

      $('#sparse').addEventListener('click', (e) => {
        sparse = !sparse
        e.target.setAttribute('aria-pressed', String(sparse))
        if (byId.usage && hist[at] === 'usage') render()
      })
      const start = (location.hash || '').slice(1)
      show(byId[start] ? start : 'general')
    </script>
  </body>
</html>
