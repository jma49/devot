    <filter id="tileshadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <filter id="dish" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="blur"/>
      <feOffset in="blur" dx="21" dy="27" result="down"/>
      <feComposite in="SourceAlpha" in2="down" operator="out" result="shadeBand"/>
      <feFlood flood-color="#5c5952" flood-opacity="0.2"/>
      <feComposite in2="shadeBand" operator="in" result="shade"/>
      <feOffset in="blur" dx="-18" dy="-21" result="up"/>
      <feComposite in="SourceAlpha" in2="up" operator="out" result="lightBand"/>
      <feFlood flood-color="#ffffff" flood-opacity="1"/>
      <feComposite in2="lightBand" operator="in" result="light"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="light"/></feMerge>
    </filter>
    <filter id="lip" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset in="blur" dx="-13.5" dy="-16.5" result="up"/>
      <feFlood flood-color="#ffffff" flood-opacity="1"/>
      <feComposite in2="up" operator="in" result="light"/>
      <feOffset in="blur" dx="15" dy="19.5" result="down"/>
      <feFlood flood-color="#5c5952" flood-opacity="0.150"/>
      <feComposite in2="down" operator="in" result="shade"/>
      <feMerge><feMergeNode in="light"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="cast" x="-20%" y="-20%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22.5"/>
      <feOffset dx="18" dy="27" result="far"/>
      <feFlood flood-color="#0d655c" flood-opacity="0.3"/>
      <feComposite in2="far" operator="in" result="farShadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="5.25"/>
      <feOffset dx="4.5" dy="7.5" result="near"/>
      <feFlood flood-color="#0d655c" flood-opacity="0.270"/>
      <feComposite in2="near" operator="in" result="nearShadow"/>
      <feMerge><feMergeNode in="farShadow"/><feMergeNode in="nearShadow"/></feMerge>
    </filter>
    <filter id="pillow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10.5" result="blur"/>
      <feOffset in="blur" dx="-9" dy="-12" result="up"/>
      <feComposite in="SourceAlpha" in2="up" operator="out" result="coreBand"/>
      <feFlood flood-color="#000000" flood-opacity="0.32"/>
      <feComposite in2="coreBand" operator="in" result="core"/>
      <feOffset in="blur" dx="7.5" dy="9" result="down"/>
      <feComposite in="SourceAlpha" in2="down" operator="out" result="rimBand"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.5"/>
      <feComposite in2="rimBand" operator="in" result="rim"/>
      <feMerge><feMergeNode in="core"/><feMergeNode in="rim"/></feMerge>
    </filter>
