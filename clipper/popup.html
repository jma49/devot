<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Devot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <header class="bar">
      <img class="mark" src="icons/dove.svg" alt="" width="20" height="18" />
      <h1 data-i18n="appName"></h1>
      <button id="options" class="icon-button" type="button" data-i18n-label="options">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
    </header>
    <main>
      <form id="clip" class="clip" hidden>
        <p class="source">
          <img id="favicon" alt="" width="16" height="16" /><span id="host"></span>
        </p>
        <label class="label" for="title" data-i18n="title"></label>
        <textarea id="title" class="field" rows="2" spellcheck="false"></textarea>
        <label class="label" for="notebook" data-i18n="notebook"></label>
        <span class="select">
          <select id="notebook"></select>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 15 5 5 5-5" />
            <path d="m7 9 5-5 5 5" />
          </svg>
        </span>
        <fieldset class="segmented">
          <legend class="label" data-i18n="mode"></legend>
          <span class="segments">
            <input type="radio" name="mode" id="mode-article" value="article" checked />
            <label for="mode-article" data-i18n="article"></label>
            <input
              type="radio"
              name="mode"
              id="mode-selection"
              value="selection"
              aria-describedby="selection-none"
            />
            <label for="mode-selection" data-i18n="selection"></label>
          </span>
        </fieldset>
        <p id="selection-none" class="caption" data-i18n="selectionNone" hidden></p>
        <p id="problem" class="problem" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 8v4" />
            <path d="M12 16h.01" />
          </svg>
          <span id="problem-text"></span>
        </p>
        <button id="save" class="button primary" type="submit" data-i18n="save"></button>
        <p id="progress" class="progress" hidden>
          <progress id="progress-bar"></progress>
          <span id="progress-text"></span>
        </p>
      </form>
      <section id="message" class="message" hidden>
        <svg
          id="message-done"
          class="message-icon done"
          viewBox="0 0 24 24"
          aria-hidden="true"
          hidden
        >
          <circle cx="12" cy="12" r="10" />
          <path d="m9 12 2 2 4-4" />
        </svg>
        <svg
          id="message-problem"
          class="message-icon problem"
          viewBox="0 0 24 24"
          aria-hidden="true"
          hidden
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v4" />
          <path d="M12 16h.01" />
        </svg>
        <h2 id="message-title"></h2>
        <p id="message-text"></p>
        <p id="message-note" class="caption" hidden></p>
        <span class="actions">
          <button id="message-secondary" class="button" type="button" hidden></button>
          <button id="message-primary" class="button primary" type="button" hidden></button>
        </span>
      </section>
      <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
