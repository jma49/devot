<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Devot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="options">
    <main>
      <header class="bar">
        <img class="mark" src="icons/dove.svg" alt="" width="28" height="24" />
        <h1 data-i18n="appName"></h1>
      </header>
      <section aria-labelledby="connect-title">
        <h2 id="connect-title" data-i18n="setupTitle"></h2>
        <form id="settings" class="card" novalidate>
          <p class="caption" data-i18n="setupIntro"></p>
          <ol class="steps">
            <li><span data-i18n="step1"></span></li>
            <li>
              <span data-i18n="step2"></span>
              <span class="row">
                <label class="visually-hidden" for="token" data-i18n="token"></label>
                <input
                  id="token"
                  class="field mono grow"
                  type="password"
                  autocomplete="off"
                  spellcheck="false"
                />
                <button
                  id="reveal"
                  class="button"
                  type="button"
                  data-i18n="showToken"
                  aria-controls="token"
                ></button>
              </span>
              <span class="caption" data-i18n="tokenHint"></span>
              <span class="row">
                <label class="label inline" for="port" data-i18n="port"></label>
                <input id="port" class="field port" type="number" min="1" max="65535" />
              </span>
            </li>
            <li>
              <span data-i18n="step3"></span>
              <span class="row">
                <label class="visually-hidden" for="origin" data-i18n="extensionOrigin"></label>
                <input id="origin" class="field mono grow" type="text" readonly />
                <button
                  id="copy-origin"
                  class="button"
                  type="button"
                  data-i18n="copyOrigin"
                ></button>
              </span>
            </li>
            <li><span data-i18n="step4"></span></li>
          </ol>
          <span class="row end">
            <button
              id="save"
              class="button primary"
              type="submit"
              data-i18n="check"
              disabled
            ></button>
          </span>
          <ul id="checks" class="checks" hidden></ul>
        </form>
      </section>
      <section aria-labelledby="images-title">
        <h2 id="images-title" data-i18n="imagesTitle"></h2>
        <div class="card">
          <p class="caption" data-i18n="imagesHint"></p>
          <span class="row between">
            <span id="images-state"></span>
            <button id="images" class="button" type="button" data-i18n="imageAccess"></button>
          </span>
        </div>
      </section>
      <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
