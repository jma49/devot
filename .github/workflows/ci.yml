name: CI

# CI runs on every pull request, every merge queue entry, every push to main,
# or when started by hand. A new push to a pull request cancels its previous
# run, and a newer main commit cancels main's: the merge queue's full run on
# each entry is the result a release relies on.
#
# A pull request runs only the jobs its files need: scripts/ci/changed-code.sh
# says which paths need the web and the Rust jobs, scripts/ci/ui-plan.ts which
# UI specs run. Without web changes, `policy-check` runs the format check,
# lint, the type check and all of Vitest, whose tests also read the docs, the
# Rust sources, migrations and capabilities and run the relay and the licence
# Worker; for documentation alone, only the format check and the policy and
# token tests. Every job runs unless the change detection said `false` for it,
# so missing outputs run everything rather than nothing.
#
# The required checks are `web`, `rust` and `policy`. Their gate jobs always
# run, so a skipped heavy job cannot leave a required check pending.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The merge queue tests each queued pull request merged onto main, as the
  # commit main will become; the release gate accepts that run.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A pull request's new push supersedes its previous run, and a newer main
  # commit supersedes main's: merges in a burst run once, on the last. A merge
  # queue entry is never cancelled here: the queue removes entries itself.
  group: >-
    ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.event_name == 'push' && 'main'
    || github.event_name == 'merge_group' && github.ref
    || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  # Decides which jobs a pull request needs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
      rust: ${{ steps.diff.outputs.rust }}
      docs_only: ${{ steps.diff.outputs.docs_only }}
      ui: ${{ steps.diff.outputs.ui }}
      ui_matrix: ${{ steps.diff.outputs.ui_matrix }}
    steps:
      # A pull request is checked out as its merge with the base branch, whose
      # first parent is the base: HEAD^1..HEAD is what the PR changes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --no-renames --name-only HEAD^1 HEAD | sh scripts/ci/changed-code.sh >> "$GITHUB_OUTPUT"
            git diff --no-renames --name-only HEAD^1 HEAD | node scripts/ci/ui-plan.ts >> "$GITHUB_OUTPUT"
          else
            printf 'web=true\nrust=true\ndocs_only=false\n' >> "$GITHUB_OUTPUT"
            node scripts/ci/ui-plan.ts --full </dev/null >> "$GITHUB_OUTPUT"
          fi

  # Pull requests without web changes: the checks that read the docs, the
  # Rust side, the relay and the licence Worker, which the web jobs would
  # otherwise run. Documentation-only changes run only the format check and
  # the policy and token tests, which read README.md, CLAUDE.md, the design
  # notes and the README images.
  policy-check:
    needs: changes
    if: needs.changes.outputs.web != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - if: needs.changes.outputs.docs_only == 'true'
        run: pnpm test:policy
      - if: needs.changes.outputs.docs_only != 'true'
        run: pnpm lint
      - if: needs.changes.outputs.docs_only != 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.docs_only != 'true'
        run: pnpm test

  # Required check for the policy work. It runs even when policy-check was
  # skipped and fails when the change detection or policy-check failed.
  policy:
    needs: [changes, policy-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          POLICY: ${{ needs.policy-check.result }}
        run: |
          echo "changes=$CHANGES policy-check=$POLICY"
          {
            printf '### Policy merge gate\n\n| Check | Result |\n| --- | --- |\n'
            printf '| %s | %s |\n' 'Change detection' "$CHANGES" 'Policy checks' "$POLICY"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$CHANGES" "$POLICY"; do
            case "$result" in
              failure|cancelled) exit 1 ;;
            esac
          done

  # Static checks finish independently of the test suites.
  web-checks:
    name: Quick checks
    needs: changes
    if: needs.changes.outputs.web != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deps:audit
      - run: pnpm tokens:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit-tests:
    name: Unit and integration tests
    needs: changes
    if: needs.changes.outputs.web != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # One build of the UI tests' bundle for every UI shard: a page of the bundle loads a few dozen
  # files where Vite's dev server sends each module, hundreds per page.
  ui-build:
    name: UI test build
    needs: changes
    if: needs.changes.outputs.ui != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ui:build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui-test-dist
          path: dist-test/
          if-no-files-found: error
          retention-days: 1

  # Separate projects so a shard runs one kind of server; both serve the shared build.
  ui:
    name: UI (${{ matrix.project }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, ui-build]
    if: needs.changes.outputs.ui != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEVOT_UI_PREBUILT: '1'
      DEVOT_UI_PROJECT: ${{ matrix.project }}
      DEVOT_UI_TEST_FILES: ${{ toJSON(matrix.files) }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.ui_matrix || '{"include":[{"project":"webkit","shard":1,"shards":14,"files":[]},{"project":"webkit","shard":2,"shards":14,"files":[]},{"project":"webkit","shard":3,"shards":14,"files":[]},{"project":"webkit","shard":4,"shards":14,"files":[]},{"project":"webkit","shard":5,"shards":14,"files":[]},{"project":"webkit","shard":6,"shards":14,"files":[]},{"project":"webkit","shard":7,"shards":14,"files":[]},{"project":"webkit","shard":8,"shards":14,"files":[]},{"project":"webkit","shard":9,"shards":14,"files":[]},{"project":"webkit","shard":10,"shards":14,"files":[]},{"project":"webkit","shard":11,"shards":14,"files":[]},{"project":"webkit","shard":12,"shards":14,"files":[]},{"project":"webkit","shard":13,"shards":14,"files":[]},{"project":"webkit","shard":14,"shards":14,"files":[]},{"project":"webkit-prod-csp","shard":1,"shards":1,"files":[]}]}') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # WebKit's system packages are 139 MB from an Ubuntu mirror that is sometimes slow. apt
      # checks each restored package against its index and downloads any that changed.
      - id: image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: playwright-apt-${{ steps.image.outputs.id }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-apt-${{ steps.image.outputs.id }}-
      - if: steps.apt.outputs.cache-matched-key != ''
        run: sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/
      # The browser download is the same for every shard of one Playwright version.
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.image.outputs.id }}-${{ steps.playwright-version.outputs.version }}
      - run: pnpm exec playwright install --with-deps webkit
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-test-dist
          path: dist-test
      - run: pnpm test:ui --add-reporter=json --shard=${{ matrix.partitioned && '1/1' || format('{0}/{1}', matrix.shard, matrix.shards) }}
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.shard == 1 && matrix.project == 'webkit' && steps.apt.outputs.cache-hit != 'true' }}
        run: mkdir -p ~/apt-archives && find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-archives {} +
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.shard == 1 && matrix.project == 'webkit' && steps.apt.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.cache-primary-key }}
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.shard == 1 && matrix.project == 'webkit' && steps.browsers.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      # Also after a green run: a test that failed once and passed on retry
      # leaves its trace here, which is the evidence for a flake.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The required web check. It runs even when the jobs it sums up were
  # skipped (a pull request without web changes) and fails when any of them,
  # or the change detection, failed or was cancelled. A failed UI build skips
  # the shards, so the gate reads the build's result too.
  web:
    needs: [changes, web-checks, unit-tests, ui-build, ui]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.web-checks.result }}
          TESTS: ${{ needs.unit-tests.result }}
          UI_BUILD: ${{ needs.ui-build.result }}
          UI: ${{ needs.ui.result }}
        run: |
          echo "changes=$CHANGES web-checks=$CHECKS unit-tests=$TESTS ui-build=$UI_BUILD ui=$UI"
          {
            printf '### Web merge gate\n\n| Check | Result |\n| --- | --- |\n'
            printf '| %s | %s |\n' 'Change detection' "$CHANGES" 'Quick checks' "$CHECKS" 'Unit and integration tests' "$TESTS" 'UI test build' "$UI_BUILD" 'UI regression tests' "$UI"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$CHANGES" "$CHECKS" "$TESTS" "$UI_BUILD" "$UI"; do
            case "$result" in
              failure|cancelled) exit 1 ;;
            esac
          done

  rust-check:
    needs: changes
    if: needs.changes.outputs.rust != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Tauri compiles against the Linux webview stack even though Devot ships
      # for macOS; macOS-only code sits behind cfg(target_os = "macos").
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      # The relay tests start the Node relay.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # tauri::generate_context! needs frontendDist to exist, but no Rust check or test reads the
      # pages, so a placeholder stands in for a UI build (the UI tests build their own).
      - run: mkdir -p dist && echo '<!doctype html><title>Devot</title>' > dist/index.html
        working-directory: .
      # Installs the toolchain, components and targets src-tauri/rust-toolchain.toml names.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # PR caches cannot help main, and the save costs the critical path.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The Mac's and the phone's `cfg` branches compile only against Apple's SDK:
  # rust-check on Linux leaves out native/macos.rs and the other macOS code.
  ios-check:
    name: macOS and iOS compile
    needs: changes
    if: needs.changes.outputs.rust != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # A placeholder for the UI, as in rust-check.
      - run: mkdir -p dist && echo '<!doctype html><title>Devot</title>' > dist/index.html
        working-directory: .
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --lib --target aarch64-apple-ios-sim -- -D warnings

  # Cargo-deny reads the manifest and lockfile, not the built app. It runs in
  # parallel with the compile-heavy job and does not pull the UI or apt stack.
  deny:
    needs: changes
    if: needs.changes.outputs.rust != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The action runs in its own container with its own Rust; it only reads the manifest.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml

  # Required check for Rust. It runs even when a Rust job was skipped and
  # fails when the change detection, compilation, tests or deny check failed.
  rust:
    needs: [changes, rust-check, ios-check, deny]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.rust-check.result }}
          IOS: ${{ needs.ios-check.result }}
          DENY: ${{ needs.deny.result }}
        run: |
          echo "changes=$CHANGES rust-check=$RUST ios-check=$IOS deny=$DENY"
          {
            printf '### Rust merge gate\n\n| Check | Result |\n| --- | --- |\n'
            printf '| %s | %s |\n' 'Change detection' "$CHANGES" 'Rust build and tests' "$RUST" 'macOS and iOS compile' "$IOS" 'Cargo deny' "$DENY"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$CHANGES" "$RUST" "$IOS" "$DENY"; do
            case "$result" in
              failure|cancelled) exit 1 ;;
            esac
          done
