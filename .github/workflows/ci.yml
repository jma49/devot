name: CI

# CI runs on every pull request, every push to main, or when started by hand.
# A new push to a pull request cancels its previous run. Pushes to main never
# cancel one another: every main commit gets its own full run.
#
# A pull request runs only the jobs its files need (scripts/ci/changed-code.sh):
# documentation-only changes skip the expensive jobs, the icon sources, the
# sync relay (relay/) and the licence Worker (licence/) need no build, changes
# under src-tauri/ need the Rust jobs
# (tauri.conf.json, whose CSP the UI tests use, and plugin-frame/, whose pages
# only they run, need both; the licence test vectors need the Rust job too),
# anything else needs both. When the web jobs are not
# needed, `policy-check` runs the formatting check, lint, the type check and
# all of Vitest, whose tests also read the documentation, the Rust sources,
# migrations and capabilities, run the relay on both of its hosts and the
# licence Worker in workerd.
#
# Every job runs unless the change detection said `false` for it, so missing
# outputs run everything rather than nothing.
#
# The required checks are `web`, `rust` and `policy`. Their gate jobs always
# run, including for documentation-only pull requests, so a skipped heavy job
# cannot leave a required check pending.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Pull requests supersede their previous run. Main commits get a unique group,
  # so every commit that can be released has a complete CI result.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides which jobs a pull request needs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
      rust: ${{ steps.diff.outputs.rust }}
      docs_only: ${{ steps.diff.outputs.docs_only }}
      ui: ${{ steps.diff.outputs.ui }}
      ui_matrix: ${{ steps.diff.outputs.ui_matrix }}
    steps:
      # A pull request is checked out as its merge with the base branch, whose
      # first parent is the base: HEAD^1..HEAD is what the PR changes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --no-renames --name-only HEAD^1 HEAD | sh scripts/ci/changed-code.sh >> "$GITHUB_OUTPUT"
            git diff --no-renames --name-only HEAD^1 HEAD | node scripts/ci/ui-plan.ts >> "$GITHUB_OUTPUT"
          else
            printf 'web=true\nrust=true\ndocs_only=false\n' >> "$GITHUB_OUTPUT"
            node scripts/ci/ui-plan.ts --full </dev/null >> "$GITHUB_OUTPUT"
          fi

  # Pull requests without web changes: the checks that read the docs, the
  # Rust side, the relay and the licence Worker, which the web jobs would
  # otherwise run. Documentation-only changes skip this; the always-on
  # `policy` gate below still satisfies the required check.
  policy-check:
    needs: changes
    if: needs.changes.outputs.web != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Required check for the policy work. It runs even when policy-check was
  # skipped and fails when the change detection or policy-check failed.
  policy:
    needs: [changes, policy-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          POLICY: ${{ needs.policy-check.result }}
        run: |
          echo "changes=$CHANGES policy-check=$POLICY"
          {
            printf '### Policy merge gate\n\n| Check | Result |\n| --- | --- |\n'
            printf '| %s | %s |\n' 'Change detection' "$CHANGES" 'Policy checks' "$POLICY"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$CHANGES" "$POLICY"; do
            case "$result" in
              failure|cancelled) exit 1 ;;
            esac
          done

  # Static checks finish independently of the test suites.
  web-checks:
    name: Quick checks
    needs: changes
    if: needs.changes.outputs.web != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deps:audit
      - run: pnpm tokens:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit-tests:
    name: Unit and integration tests
    needs: changes
    if: needs.changes.outputs.web != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Separate projects so development shards never build the production-CSP bundle.
  ui:
    name: UI (${{ matrix.project }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.ui != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEVOT_UI_PROJECT: ${{ matrix.project }}
      DEVOT_UI_TEST_FILES: ${{ toJSON(matrix.files) }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.ui_matrix || '{"include":[{"project":"webkit","shard":1,"shards":12,"files":[]},{"project":"webkit","shard":2,"shards":12,"files":[]},{"project":"webkit","shard":3,"shards":12,"files":[]},{"project":"webkit","shard":4,"shards":12,"files":[]},{"project":"webkit","shard":5,"shards":12,"files":[]},{"project":"webkit","shard":6,"shards":12,"files":[]},{"project":"webkit","shard":7,"shards":12,"files":[]},{"project":"webkit","shard":8,"shards":12,"files":[]},{"project":"webkit","shard":9,"shards":12,"files":[]},{"project":"webkit","shard":10,"shards":12,"files":[]},{"project":"webkit","shard":11,"shards":12,"files":[]},{"project":"webkit","shard":12,"shards":12,"files":[]},{"project":"webkit-prod-csp","shard":1,"shards":1,"files":[]}]}') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:ui --add-reporter=json --shard=${{ matrix.partitioned && '1/1' || format('{0}/{1}', matrix.shard, matrix.shards) }}
      # Also after a green run: a test that failed once and passed on retry
      # leaves its trace here, which is the evidence for a flake.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The required web check. It runs even when the jobs it sums up were
  # skipped (a pull request without web changes) and fails when any of them,
  # or the change detection, failed or was cancelled.
  web:
    needs: [changes, web-checks, unit-tests, ui]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.web-checks.result }}
          TESTS: ${{ needs.unit-tests.result }}
          UI: ${{ needs.ui.result }}
        run: |
          echo "changes=$CHANGES web-checks=$CHECKS unit-tests=$TESTS ui=$UI"
          {
            printf '### Web merge gate\n\n| Check | Result |\n| --- | --- |\n'
            printf '| %s | %s |\n' 'Change detection' "$CHANGES" 'Quick checks' "$CHECKS" 'Unit and integration tests' "$TESTS" 'UI regression tests' "$UI"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$CHANGES" "$CHECKS" "$TESTS" "$UI"; do
            case "$result" in
              failure|cancelled) exit 1 ;;
            esac
          done

  rust-check:
    needs: changes
    if: needs.changes.outputs.rust != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Tauri compiles against the Linux webview stack even though Devot ships
      # for macOS; macOS-only code sits behind cfg(target_os = "macos").
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      # tauri::generate_context! embeds the built UI, so build it first.
      - run: pnpm install --frozen-lockfile && pnpm ui:build
        working-directory: .
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Cargo-deny reads the manifest and lockfile, not the built app. It runs in
  # parallel with the compile-heavy job and does not pull the UI or apt stack.
  deny:
    needs: changes
    if: needs.changes.outputs.rust != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml

  # Required check for Rust. It runs even when a Rust job was skipped and
  # fails when the change detection, compilation, tests or deny check failed.
  rust:
    needs: [changes, rust-check, deny]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.rust-check.result }}
          DENY: ${{ needs.deny.result }}
        run: |
          echo "changes=$CHANGES rust-check=$RUST deny=$DENY"
          {
            printf '### Rust merge gate\n\n| Check | Result |\n| --- | --- |\n'
            printf '| %s | %s |\n' 'Change detection' "$CHANGES" 'Rust build and tests' "$RUST" 'Cargo deny' "$DENY"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$CHANGES" "$RUST" "$DENY"; do
            case "$result" in
              failure|cancelled) exit 1 ;;
            esac
          done
