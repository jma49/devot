name: CI

# CI runs on every pull request, every merge queue entry, every push to main,
# or when started by hand. A new push to a pull request cancels its previous
# run, and a newer main commit cancels main's: the merge queue's full run on
# each entry is the result a release relies on.
#
# A pull request runs only the jobs its files need: scripts/ci/changed-code.sh
# says which paths need the web and the Rust jobs, scripts/ci/ui-plan.ts which
# UI specs run. Without web changes, `policy-check` runs the format check,
# lint, the type check and all of Vitest, whose tests also read the docs, the
# Rust sources, migrations and capabilities and run the relay and the licence
# Worker; for documentation alone, only the format check and the policy and
# token tests. Every job runs unless the change detection said `false` for it,
# so missing outputs run everything rather than nothing.
#
# The required checks are `web`, `rust` and `policy`. Their gate jobs always
# run, so a skipped heavy job cannot leave a required check pending.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The merge queue tests each queued pull request merged onto main, as the
  # commit main will become; the release gate accepts that run.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A pull request's new push supersedes its previous run, and a newer main
  # commit supersedes main's: merges in a burst run once, on the last. A merge
  # queue entry is never cancelled here: the queue removes entries itself.
  group: >-
    ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || github.event_name == 'push' && 'main'
    || github.event_name == 'merge_group' && github.ref
    || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

# The iPhone jobs build with this Xcode and test on this iOS simulator runtime, both on the
# `xcode-27` runner image (scripts/ci/xcode.sh and scripts/ci/iphone-simulator.ts fail the job when
# the image lacks them); app-store.yml pins the same Xcode for the shipped build.
env:
  DEVOT_XCODE: /Applications/Xcode_27.2.app
  DEVOT_IOS: '27.2'

jobs:
  # Decides which jobs a pull request needs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
      rust: ${{ steps.diff.outputs.rust }}
      docs_only: ${{ steps.diff.outputs.docs_only }}
      iphone_ui: ${{ steps.diff.outputs.iphone_ui }}
      iphone_ui_full: ${{ steps.diff.outputs.iphone_ui_full }}
      ui: ${{ steps.diff.outputs.ui }}
      ui_matrix: ${{ steps.diff.outputs.ui_matrix }}
    steps:
      # A pull request is checked out as its merge with the base branch, whose
      # first parent is the base: HEAD^1..HEAD is what the PR changes.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --no-renames --name-only HEAD^1 HEAD | sh scripts/ci/changed-code.sh >> "$GITHUB_OUTPUT"
            git diff --no-renames --name-only HEAD^1 HEAD | node scripts/ci/ui-plan.ts >> "$GITHUB_OUTPUT"
            echo iphone_ui_full=false >> "$GITHUB_OUTPUT"
          else
            printf 'web=true\nrust=true\ndocs_only=false\niphone_ui=true\n' >> "$GITHUB_OUTPUT"
            echo iphone_ui_full=true >> "$GITHUB_OUTPUT"
            node scripts/ci/ui-plan.ts --full </dev/null >> "$GITHUB_OUTPUT"
          fi

  # Pull requests without web changes: the checks that read the docs, the
  # Rust side, the relay and the licence Worker, which the web jobs would
  # otherwise run. Documentation-only changes run only the format check and
  # the policy and token tests, which read README.md, CLAUDE.md, the design
  # notes and the README images.
  policy-check:
    needs: changes
    if: needs.changes.outputs.web != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - if: needs.changes.outputs.docs_only == 'true'
        run: pnpm test:policy
      - if: needs.changes.outputs.docs_only != 'true'
        run: pnpm lint
      - if: needs.changes.outputs.docs_only != 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.docs_only != 'true'
        run: pnpm test

  # Required check for the policy work. It runs even when policy-check was
  # skipped and fails when the change detection or policy-check failed.
  policy:
    needs: [changes, policy-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          POLICY: ${{ needs.policy-check.result }}
        run: |
          echo "changes=$CHANGES policy-check=$POLICY"
          {
            printf '### Policy merge gate\n\n| Check | Result |\n| --- | --- |\n'
            printf '| %s | %s |\n' 'Change detection' "$CHANGES" 'Policy checks' "$POLICY"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$CHANGES" "$POLICY"; do
            case "$result" in
              failure|cancelled) exit 1 ;;
            esac
          done

  # Static checks finish independently of the test suites.
  web-checks:
    name: Quick checks
    needs: changes
    if: needs.changes.outputs.web != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deps:audit
      - run: pnpm tokens:check
      - run: pnpm i18n:apple:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit-tests:
    name: Unit and integration tests
    needs: changes
    if: needs.changes.outputs.web != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # One build of the UI tests' bundle for every UI shard: a page of the bundle loads a few dozen
  # files where Vite's dev server sends each module, hundreds per page.
  ui-build:
    name: UI test build
    needs: changes
    if: needs.changes.outputs.ui != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ui:build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui-test-dist
          path: dist-test/
          if-no-files-found: error
          retention-days: 1

  # Separate projects so a shard runs one kind of server; both serve the shared build.
  ui:
    name: UI (${{ matrix.project }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, ui-build]
    if: needs.changes.outputs.ui != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEVOT_UI_PREBUILT: '1'
      DEVOT_UI_PROJECT: ${{ matrix.project }}
      DEVOT_UI_TEST_FILES: ${{ toJSON(matrix.files) }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.ui_matrix || '{"include":[{"project":"webkit","shard":1,"shards":14,"files":[]},{"project":"webkit","shard":2,"shards":14,"files":[]},{"project":"webkit","shard":3,"shards":14,"files":[]},{"project":"webkit","shard":4,"shards":14,"files":[]},{"project":"webkit","shard":5,"shards":14,"files":[]},{"project":"webkit","shard":6,"shards":14,"files":[]},{"project":"webkit","shard":7,"shards":14,"files":[]},{"project":"webkit","shard":8,"shards":14,"files":[]},{"project":"webkit","shard":9,"shards":14,"files":[]},{"project":"webkit","shard":10,"shards":14,"files":[]},{"project":"webkit","shard":11,"shards":14,"files":[]},{"project":"webkit","shard":12,"shards":14,"files":[]},{"project":"webkit","shard":13,"shards":14,"files":[]},{"project":"webkit","shard":14,"shards":14,"files":[]},{"project":"webkit-prod-csp","shard":1,"shards":1,"files":[]}]}') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # WebKit's system packages are 139 MB from an Ubuntu mirror that is sometimes slow. apt
      # checks each restored package against its index and downloads any that changed.
      - id: image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: playwright-apt-${{ steps.image.outputs.id }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-apt-${{ steps.image.outputs.id }}-
      - if: steps.apt.outputs.cache-matched-key != ''
        run: sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/
      # The browser download is the same for every shard of one Playwright version.
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ steps.image.outputs.id }}-${{ steps.playwright-version.outputs.version }}
      - run: pnpm exec playwright install --with-deps webkit
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ui-test-dist
          path: dist-test
      - run: pnpm test:ui --add-reporter=json --shard=${{ matrix.partitioned && '1/1' || format('{0}/{1}', matrix.shard, matrix.shards) }}
      - if: ${{ !cancelled() }}
        run: node scripts/ci/playwright-flaky.ts test-results/report.json
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.shard == 1 && matrix.project == 'webkit' && steps.apt.outputs.cache-hit != 'true' }}
        run: mkdir -p ~/apt-archives && find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-archives {} +
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.shard == 1 && matrix.project == 'webkit' && steps.apt.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.cache-primary-key }}
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && matrix.shard == 1 && matrix.project == 'webkit' && steps.browsers.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      # Also after a green run: a test that failed once and passed on retry
      # leaves its trace here, which is the evidence for a flake.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The tests that need a Mac but no iPhone image share one macos-26 runner, since the account runs
  # five macOS jobs at a time. The signing scripts' tests need Apple's tools and skip on the Linux
  # runners; a change to scripts/ or tests/ counts as a web change, so a Rust-only one skips them.
  # StoreKit Test hung under xcodebuild on the xcode-27 image's iOS 27 simulators (CI run
  # 42469038809) and on iOS 27.2 locally, and is broken on iOS 26.4 and 26.5, so the StoreKit bridge
  # is tested on macos-26's iOS 26.2, where it passes. It builds with the iOS 27 SDK in iphone-build.
  mac-tests:
    name: macOS tests
    needs: changes
    if: (needs.changes.outputs.web != 'false' || needs.changes.outputs.rust != 'false') && needs.changes.outputs.docs_only != 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.web != 'false'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.web != 'false'
        run: pnpm vitest run tests/scripts/macos- tests/scripts/ios-
      - if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
        run: brew install xcodegen
      - if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
        run: sh scripts/ci/devot-store-tests.sh

  # The required web check. It runs even when the jobs it sums up were
  # skipped (a pull request without web changes) and fails when any of them,
  # or the change detection, failed or was cancelled. A failed UI build skips
  # the shards, so the gate reads the build's result too.
  web:
    needs: [changes, web-checks, unit-tests, ui-build, ui, mac-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.web-checks.result }}
          TESTS: ${{ needs.unit-tests.result }}
          UI_BUILD: ${{ needs.ui-build.result }}
          UI: ${{ needs.ui.result }}
          MAC: ${{ needs.mac-tests.result }}
        run: |
          echo "changes=$CHANGES web-checks=$CHECKS unit-tests=$TESTS ui-build=$UI_BUILD ui=$UI mac-tests=$MAC"
          {
            printf '### Web merge gate\n\n| Check | Result |\n| --- | --- |\n'
            printf '| %s | %s |\n' 'Change detection' "$CHANGES" 'Quick checks' "$CHECKS" 'Unit and integration tests' "$TESTS" 'UI test build' "$UI_BUILD" 'UI regression tests' "$UI" 'macOS tests' "$MAC"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$CHANGES" "$CHECKS" "$TESTS" "$UI_BUILD" "$UI" "$MAC"; do
            case "$result" in
              failure|cancelled) exit 1 ;;
            esac
          done

  rust-check:
    needs: changes
    if: needs.changes.outputs.rust != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Tauri compiles against the Linux webview stack even though Devot ships
      # for macOS; macOS-only code sits behind cfg(target_os = "macos").
      # The change watch and backup tests reach the database from a second process through the sqlite3 shell.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev sqlite3
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      # The relay tests start the Node relay.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # tauri::generate_context! needs frontendDist to exist, but no Rust check or test reads the
      # pages, so a placeholder stands in for a UI build (the UI tests build their own).
      - run: mkdir -p dist && echo '<!doctype html><title>Devot</title>' > dist/index.html
        working-directory: .
      # Installs the toolchain, components and targets src-tauri/rust-toolchain.toml names.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # PR caches cannot help main, and the save costs the critical path.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The Swift packages (src-tauri/apple/DevotStore and DevotScreens): their tests in host apps on an
  # iPhone simulator, as StoreKit Test and UIKit need. iphone-build builds the app that links them.
  # The release check builds the screens package twice more, so pull requests leave it to the merge queue.
  ios-app:
    name: iPhone screens tests
    needs: changes
    if: needs.changes.outputs.rust != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sh scripts/ci/xcode.sh
      - run: brew install xcodegen
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # A cold boot takes a minute or more: it runs in the background, and the test script waits for it.
      - name: Boot the iPhone simulator
        run: |
          device=$(xcrun simctl list devices available --json | node scripts/ci/iphone-simulator.ts --os "$DEVOT_IOS")
          echo "DEVOT_SIMULATOR=$device" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$device" >>"$RUNNER_TEMP/simulator-boot.log" 2>&1 &
      - run: sh scripts/ci/devot-screens-tests.sh
      # The spike harness is built into a debug app only (docs/specs/iphone-screens.md, Spikes).
      - if: github.event_name != 'pull_request'
        run: sh scripts/ci/devot-screens-release-check.sh

  # The iPhone app for the simulator, with the release UI build: the only build that links the
  # Swift packages and Rust's calls into them. When the UI test runs, this job also builds its test
  # runner. On a pull request it runs the smoke shard itself, on a simulator it boots once the build
  # and the compile checks are done; on a full run it hands both to the iphone-ui shards as one artifact, and the shards start
  # only once this job ends, so nothing waits behind the upload but the compile checks. The Mac's and
  # the phone's `cfg` branches, which compile only against Apple's SDK, are checked here: rust-check
  # on Linux leaves out native/macos/ and the other macOS code.
  iphone-build:
    name: iPhone app build
    needs: changes
    if: needs.changes.outputs.rust != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      DEVOT_UI_SHARD: smoke
      # The tests' waits are sized on an idle simulator; this runner's load stretches them (Tests/Waits.swift).
      DEVOT_UI_WAIT_SCALE: '3'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sh scripts/ci/xcode.sh
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: brew install xcodegen
      # pnpm checks the lockfile against its supply-chain policies with registry metadata, which
      # this image fetched in 4-5 min; its metadata cache keeps the verdict for an unchanged lockfile.
      - id: pnpm-cache-path
        run: echo "path=$(pnpm cache path)" >> "$GITHUB_OUTPUT"
      - id: pnpm-metadata
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache-path.outputs.path }}
          key: pnpm-metadata-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: pnpm-metadata-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - if: steps.pnpm-metadata.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache-path.outputs.path }}
          key: ${{ steps.pnpm-metadata.outputs.cache-primary-key }}
      - run: rustup toolchain install
        working-directory: src-tauri
      # The dependencies built with this Xcode's SDK. Saved from main only, so a pull request never
      # writes a cache that a later run builds on.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: iphone-sim
          key: xcode-${{ env.DEVOT_XCODE_BUILD }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Tauri's beforeBuildCommand builds the release UI, which the app embeds.
      - run: pnpm tauri ios build --debug --target aarch64-sim
      - id: runner
        if: needs.changes.outputs.iphone_ui != 'false'
        run: sh scripts/ci/iphone-ui-tests.sh build
      # tar keeps the bundles' symbolic links and file modes, which the artifact's zip would not.
      - if: needs.changes.outputs.iphone_ui != 'false' && needs.changes.outputs.iphone_ui_full != 'false'
        run: tar -C test-results -cf - iphone-ui-build | zstd -T0 -10 -q -o "$RUNNER_TEMP/iphone-ui-build.tar.zst"
      - if: needs.changes.outputs.iphone_ui != 'false' && needs.changes.outputs.iphone_ui_full != 'false'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: iphone-ui-build
          path: ${{ runner.temp }}/iphone-ui-build.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      # The generated Swift tokens and strings on their own; ios-app compiles the whole package.
      - if: ${{ !cancelled() }}
        run: xcrun --sdk iphonesimulator swiftc -typecheck -swift-version 6 -warnings-as-errors -target arm64-apple-ios26.0-simulator apple/DevotScreens/Sources/DevotScreens/Generated/*.swift
        working-directory: src-tauri
      # The typecheck never runs L10n's placeholder filling; this checks it against the page's cases.
      - if: ${{ !cancelled() }}
        run: swiftc -swift-version 6 -warnings-as-errors -o "$RUNNER_TEMP/strings-check" apple/DevotScreens/Sources/DevotScreens/Generated/Strings.swift apple/DevotScreens/Checks/main.swift && "$RUNNER_TEMP/strings-check"
        working-directory: src-tauri
      - if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - if: ${{ !cancelled() }}
        run: cargo clippy --lib --target aarch64-apple-ios-sim -- -D warnings
        working-directory: src-tauri
      # The input bar's Objective-C runtime tests run only on an Apple host.
      - if: ${{ !cancelled() }}
        run: cargo test --lib input_accessory
        working-directory: src-tauri
      # The simulator boots only now: booting it during the build kept this 3-core runner's load in the
      # hundreds and made brew, the app build and clippy several times slower (PR #879).
      - name: Boot the iPhone simulator
        if: ${{ !cancelled() && steps.runner.outcome == 'success' && needs.changes.outputs.iphone_ui_full == 'false' }}
        run: |
          device=$(xcrun simctl list devices available --json | node scripts/ci/iphone-simulator.ts --os "$DEVOT_IOS")
          echo "DEVOT_SIMULATOR=$device" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$device" >"$RUNNER_TEMP/simulator-boot.log" 2>&1 &
      - if: ${{ !cancelled() && steps.runner.outcome == 'success' && needs.changes.outputs.iphone_ui_full == 'false' }}
        run: sh scripts/ci/iphone-ui-tests.sh settle
      - if: ${{ !cancelled() && steps.runner.outcome == 'success' && needs.changes.outputs.iphone_ui_full == 'false' }}
        run: sh scripts/ci/iphone-ui-tests.sh test
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: iphone-ui-xcresult-smoke
          path: test-results/iphone-ui.xcresult/
          if-no-files-found: ignore
          retention-days: 7

  # The shipping iPhone app, with the release UI build, launched in a simulator: the XCUITests
  # (src-tauri/apple/DevotUITests) switch every tab of the native tab bar, run the system's
  # accessibility audit and go through the screens. They run for the native screens, the phone page
  # and the app project (scripts/ci/changed-code.sh). A pull request runs only the smoke shard, in
  # iphone-build; the merge queue, main and manual runs run every shard here, smoke included, from
  # iphone-build's app and test runner, side by side (scripts/ci/iphone-ui-shards.ts).
  iphone-ui:
    name: iPhone UI test (${{ matrix.shard }})
    needs: [changes, iphone-build]
    if: needs.changes.outputs.iphone_ui != 'false' && needs.changes.outputs.iphone_ui_full != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: xcode-27
    # A slow xcode-27 runner spends up to 10 minutes on the download and the settle before a test runs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [smoke, settings, rest]
    env:
      DEVOT_UI_SHARD: ${{ matrix.shard }}
      DEVOT_UI_WAIT_SCALE: '3'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: scripts/ci
      - run: sh scripts/ci/xcode.sh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # A cold boot takes a minute or more: it runs in the background during the download, and the
      # test script waits for it.
      - name: Boot the iPhone simulator
        run: |
          device=$(xcrun simctl list devices available --json | node scripts/ci/iphone-simulator.ts --os "$DEVOT_IOS")
          echo "DEVOT_SIMULATOR=$device" >> "$GITHUB_ENV"
          nohup xcrun simctl boot "$device" >"$RUNNER_TEMP/simulator-boot.log" 2>&1 &
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: iphone-ui-build
          path: ${{ runner.temp }}
      - run: mkdir -p test-results && zstd -dc "$RUNNER_TEMP/iphone-ui-build.tar.zst" | tar -C test-results -xf -
      - name: Let the simulator settle
        run: sh scripts/ci/iphone-ui-tests.sh settle
      - run: sh scripts/ci/iphone-ui-tests.sh test
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: iphone-ui-xcresult-${{ matrix.shard }}
          path: test-results/iphone-ui.xcresult/
          if-no-files-found: ignore
          retention-days: 7

  # Cargo-deny reads the manifest and lockfile, not the built app. It runs in
  # parallel with the compile-heavy job and does not pull the UI or apt stack.
  deny:
    needs: changes
    if: needs.changes.outputs.rust != 'false' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup toolchain install
      # Built from crates.io: cargo-deny-action fetched the tool from a GitHub release download,
      # which stopped serving the archive (#792). The build takes two minutes, so the binary is kept per version.
      - id: deny-bin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.deny-bin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny@0.20.2
      - if: steps.deny-bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.deny-bin.outputs.cache-primary-key }}
      - run: cargo deny check

  # Required check for Rust. It runs even when a Rust job was skipped and
  # fails when the change detection, compilation, tests, the macOS tests, the
  # iPhone app build with its compile checks and smoke shard, any iPhone UI test
  # shard or the deny check failed.
  rust:
    needs: [changes, rust-check, ios-app, mac-tests, iphone-build, iphone-ui, deny]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.rust-check.result }}
          IOS_APP: ${{ needs.ios-app.result }}
          MAC: ${{ needs.mac-tests.result }}
          IPHONE_BUILD: ${{ needs.iphone-build.result }}
          IPHONE_UI: ${{ needs.iphone-ui.result }}
          DENY: ${{ needs.deny.result }}
        run: |
          echo "changes=$CHANGES rust-check=$RUST ios-app=$IOS_APP mac-tests=$MAC iphone-build=$IPHONE_BUILD iphone-ui=$IPHONE_UI deny=$DENY"
          {
            printf '### Rust merge gate\n\n| Check | Result |\n| --- | --- |\n'
            printf '| %s | %s |\n' 'Change detection' "$CHANGES" 'Rust build and tests' "$RUST" 'iPhone screens tests' "$IOS_APP" 'macOS tests' "$MAC" 'iPhone app build' "$IPHONE_BUILD" 'iPhone UI test' "$IPHONE_UI" 'Cargo deny' "$DENY"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$CHANGES" "$RUST" "$IOS_APP" "$MAC" "$IPHONE_BUILD" "$IPHONE_UI" "$DENY"; do
            case "$result" in
              failure|cancelled) exit 1 ;;
            esac
          done
