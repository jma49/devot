name: Flaky tracker

# After each CI run on main or in the merge queue, every test that passed only on CI's retry gets
# an open issue labelled `flaky`, or a comment on the one it has (scripts/ci/flaky-tracker.ts).
# Pull request runs are left out: a flake there may be the pull request's own change.
# A failed run on main has its failed jobs run again, once (hence actions: write), and the
# "CI health" issue carries main's pass rate.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  track:
    if: (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') || github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/ci/flaky-tracker.ts
