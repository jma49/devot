      <p class="byline">By <em>A. Writer</em></p>
      <p>
        A slow morning starts with <strong>water</strong>, then
        <a href="https://example.com/tea">tea</a>.
      </p>
      <h2>What helps</h2>
      <ul>
        <li>No phone for the first hour</li>
        <li>A <code>kettle</code> that whistles</li>
        <li>
          Open windows
          <ul>
            <li>even in winter</li>
          </ul>
        </li>
      </ul>
      <blockquote><p>Nothing is urgent before nine.</p></blockquote>
      <h2>Order of things</h2>
      <ol>
        <li>Water</li>
        <li>Tea</li>
        <li>Read</li>
      </ol>
