# cargo-deny: licences, advisories, bans and sources for the Rust crate.
# Run with `cargo deny check` from src-tauri/.

[graph]
# Check only what Devot ships: macOS now, iOS later. Linux-only GTK crates
# never reach a Devot binary.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-apple-ios"]
all-features = false

[advisories]
# Any advisory, including "unmaintained", fails the check unless listed here
# with a reason.
ignore = []

[licenses]
# Licences compatible with Devot's own (FSL-1.1-MIT, MIT two years after each release).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  # Root certificate data bundled by ureq (Sentry's transport); permissive.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# Some allowed licences are not in use yet; that is fine.
unused-allowed-license = "allow"

[licenses.private]
# Devot's own licence is not on the list; publish = false keeps it out of the check.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
