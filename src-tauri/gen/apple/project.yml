name: devot
options:
  bundleIdPrefix: io.github.jma49.devot
  deploymentTarget:
    iOS: 26.0
fileGroups: [../../src]
# StoreKit 2 (docs/adr/0014) and the native screens (docs/specs/iphone-screens.md), each behind a
# C ABI that native/ios/store.rs or native/ios/screens.rs calls. Only the iPhone app links them.
packages:
  DevotStore:
    path: ../../apple/DevotStore
  DevotScreens:
    path: ../../apple/DevotScreens
  # The Share Extension's sheet and the inbox it leaves shares in (docs/specs/share-extension.md).
  DevotShare:
    path: ../../apple/DevotShare
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Devot
      PRODUCT_BUNDLE_IDENTIFIER: io.github.jma49.devot
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  devot_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: devot_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: devot_iOS/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleLocalizations: [en, zh-Hans]
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1.0.0"
        ITSAppUsesNonExemptEncryption: false
        DevotCloudKitContainer: $(DEVOT_CLOUDKIT_CONTAINER)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).devot
            CFBundleURLSchemes: [devot]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        # DEVOT_ICLOUD=YES, set only by the build that ships, gives the build the iCloud entitlements
        # and its container in Info.plist; without it the build has neither (docs/releasing.md), only
        # the App Group the Share Extension leaves shares in.
        CODE_SIGN_ENTITLEMENTS: $(DEVOT_ENTITLEMENTS_$(DEVOT_ICLOUD))
        DEVOT_ENTITLEMENTS_YES: devot_iOS/devot_iOS.entitlements
        DEVOT_ENTITLEMENTS_: devot_iOS/devot_iOS-local.entitlements
        DEVOT_CLOUDKIT_CONTAINER: $(DEVOT_CLOUDKIT_CONTAINER_$(DEVOT_ICLOUD))
        DEVOT_CLOUDKIT_CONTAINER_YES: iCloud.io.github.jma49.devot
        ENABLE_BITCODE: false
        # iPhone only for the first App Store release (docs/adr/0014); the iPad comes later.
        TARGETED_DEVICE_FAMILY: 1
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - package: DevotStore
      - package: DevotScreens
      - target: devot_Share
        embed: true
        codeSign: true
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          pnpm tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # The Share Extension (docs/specs/share-extension.md): a compose sheet that leaves each share in
  # the App Group's inbox. It opens no database and no key; the app makes the notes.
  devot_Share:
    type: app-extension
    platform: iOS
    sources:
      - path: devot_Share
    info:
      path: devot_Share/Info.plist
      properties:
        CFBundleDisplayName: Devot
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1.0.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
    settings:
      base:
        PRODUCT_NAME: devot_Share
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jma49.devot.share
        CODE_SIGN_ENTITLEMENTS: devot_Share/devot_Share.entitlements
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
    dependencies:
      - package: DevotShare
        product: DevotShare
