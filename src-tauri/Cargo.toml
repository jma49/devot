[package]
name = "devot"
version = "0.0.0"
description = "A local-first Markdown note-taking app"
license = "FSL-1.1-MIT"
repository = "https://github.com/jma49/devot"
edition = "2024"
publish = false

[lib]
# The library form lets the same code run as the iOS app later.
name = "devot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `tray-icon`: the menu bar icon (`menu_bar`).
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
# Crash reporting: panics only, sent over the system TLS stack. Debug images
# list the binaries a panic's frames are in (by debug ID), so Sentry can name
# the functions of a stripped release build from its uploaded devot.dSYM.
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "debug-images",
  "panic",
  "ureq",
  "native-tls",
] }
# Sends saved native crash reports itself, to learn whether Sentry took
# them; the same ureq and TLS stack as Sentry's own transport.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "functions", "hooks"] }
tokio = { version = "1", features = ["sync", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }
# The native folder panel for Markdown import, used from Rust only.
tauri-plugin-dialog = "2.8"
# The Markdown mirror's manifest records each file's SHA-256 (the core
# hashes the same way). Already in the tree through Tauri.
sha2 = "0.10"
# Safe calls relative to a folder handle (openat, mkdirat, renameat and
# renameatx_np, unlinkat, fstatat) for atomic_file, so no folder on the way
# to a file can be swapped for a link after Devot looked. File system calls
# only; already in the tree through tempfile (native-tls).
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
tauri-plugin-updater = "2"
# Plugin packages as `.zip` archives (`plugins::package`), deflate through
# flate2's Rust backend, already in the tree. Read entry by entry, never
# through `extract` (no links, no permission bits).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# devot:// links from other apps (`deep_link`), and a second launch handing
# its arguments to the running Devot instead of opening the data folder.
tauri-plugin-deep-link = "2"
# Sync's record encryption and key derivation (`sync`), RustCrypto's audited
# AES-GCM and HKDF; nonces and keys come from the OS through getrandom, and
# key bytes are wiped on drop (zeroize). getrandom and zeroize are already in
# the tree.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = "0.12"
getrandom = "0.3"
zeroize = "1"
# Licence keys and the revocation list (`licence`): Ed25519 verification only, against the
# public keys the build holds (docs/licensing.md, Formats).
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
# The sync relay's socket (`sync::client`), blocking on a thread of its own, over the system TLS
# stack as ureq is.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
# The pairing code's QR code (`sync::pairing`), as modules the page draws; no image or SVG
# rendering, so no dependencies of its own.
qrcode = { version = "0.14", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Quick capture's shortcut, registered from Rust alone while menu bar mode is
# on (`menu_bar`); no window is granted the plugin's commands.
tauri-plugin-global-shortcut = "2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
# Provider keys (`ai::keychain`) and the sync vault key's keychain item
# (`sync::keychain`, `native::ios`). All three are already in the tree
# through native-tls.
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
# Native crash reports (DSN builds only): the exception handler in the app,
# the Mach IPC that hands a crash to the reporter process, the minidump
# writer it runs, and the parser that turns the minidump into a stack trace.
crash-handler = "0.8"
crash-context = "0.8"
minidump-writer = "0.13"
minidump = "0.26"
# What the crash handler restores once it has reported a crash or its
# reporter has gone: the SIGABRT action and the Mach exception ports. Both
# crates already come with crash-handler.
libc = "0.2"
mach2 = "0.6"
# `exception`: a private API that throws an Objective-C exception is caught
# (`objc2::exception::catch`) and falls back; catch_unwind cannot stop one.
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSString",
  "NSData",
  "NSDictionary",
  "NSArray",
  "NSUserDefaults",
  "NSDistributedNotificationCenter",
  "NSNotification",
  "NSOperation",
  "NSObject",
  "NSURL",
  "NSError",
  "NSDate",
  "NSValue",
  "NSRunLoop",
  "NSGeometry",
  "NSObjCRuntime",
  "NSRange",
  "NSDateFormatter",
  "NSFormatter",
  "NSLocale",
  "NSAttributedString",
  "block2",
] }
objc2-app-kit = { version = "0.3", features = [
  # The alert a launch that cannot open the notes shows (startup.rs).
  "NSAlert",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  # The font Look Up draws its word in (NSFontAttributeName).
  "NSAttributedString",
  "NSFont",
  "NSFontDescriptor",
  # The font families Settings offers for the editor (fonts.rs).
  "NSFontManager",
  "NSColor",
  "NSColorSpace",
  "NSAppearance",
  "NSPasteboard",
  "NSApplication",
  "NSEvent",
  "NSGraphicsContext",
  "NSMenu",
  "NSMenuItem",
  # Spelling guesses in the editor's menu.
  "NSSpellChecker",
  "NSResponder",
  "NSWindow",
  "NSView",
  "NSPrintInfo",
  "NSPrintOperation",
  # The header and footer drawn on printed pages (page_setup.rs).
  "NSStringDrawing",
  "NSParagraphStyle",
  # Marked text: what the Format key monitor asks before it offers a key.
  "NSText",
  "NSTextView",
  "NSTextInputClient",
  "block2",
] }
# Printing a note: an offscreen web view of the exported page.
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "WKNavigation",
  "WKNavigationDelegate",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebpagePreferences",
] }
# Page setup (page_setup.rs): the printed PDF's pages are drawn again with
# their header and footer, links kept, and printed from the PDF.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFURL",
  "CFString",
  "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "CGContext",
  "CGPDFContext",
] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "objc2-core-graphics",
  "PDFDocument",
  "PDFPage",
  "PDFAnnotation",
  "PDFAnnotationUtilities",
  "PDFAction",
  "PDFActionURL",
  "PDFActionGoTo",
  "PDFDestination",
] }

[target.'cfg(target_os = "ios")'.dependencies]
# SF Symbols drawn through UIKit (`native::ios`); `exception` as on macOS.
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSData",
  "NSString",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFCGTypes",
] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "UIColor",
  "UIGraphicsImageRenderer",
  "UIGraphicsRenderer",
  "UIImage",
  "UIImageConfiguration",
  "UIImageSymbolConfiguration",
  "UITraitCollection",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# tauri-plugin-deep-link 2.6.2 builds ini::ParseOption with a struct literal
# that rust-ini 0.21.2 broke by adding fields. Drop the pin once it is fixed.
rust-ini = "=0.21.1"

[[test]]
name = "main_thread"
harness = false

[[test]]
name = "native_crash"
harness = false

[lints.rust]
# Only src/native may opt back in, with a SAFETY comment on every block.
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Line tables go to a separate devot.dSYM next to the binary, which stays
# stripped; `pnpm sentry:debug-files` uploads it so that native crash
# reports show function names. It is never part of the app bundle.
debug = "line-tables-only"
split-debuginfo = "packed"

# Debug builds keep line tables only (file and line in backtraces, no full
# variable info), which keeps target/ several gigabytes smaller per checkout.
[profile.dev]
debug = "line-tables-only"

[dev-dependencies]
tempfile = "3"
