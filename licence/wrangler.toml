# Devot's licence Worker on the owner's Cloudflare account (docs/licensing.md).
# Secrets (wrangler secret put): LICENCE_SIGNING_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY.
name = "devot-licence"
main = "src/worker.ts"
compatibility_date = "2026-07-30"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "devot-licence"
migrations_dir = "migrations"

[vars]
LICENCE_KID = ""
STRIPE_PRICE_LICENCE = ""
STRIPE_PRICE_RENEWAL = ""
MANAGED_PAYMENTS = "true"
MAIL_FROM = ""
REPLY_TO = ""
CANCEL_URL = ""
