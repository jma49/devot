# Devot sync relay on the owner's own Cloudflare account (docs/sync-relay.md).
# Rename the Worker if you like; keep the bindings, the classes and the migrations.
name = "devot-relay"
main = "src/worker.ts"
compatibility_date = "2026-07-30"
workers_dev = true

[[durable_objects.bindings]]
name = "VAULTS"
class_name = "VaultObject"

[[durable_objects.bindings]]
name = "PAIRINGS"
class_name = "PairingObject"

# SQLite storage: the only Durable Object storage on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultObject"]

# Device pairing (docs/adr/0008-sync-device-pairing.md): one object per pairing.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["PairingObject"]

# Shared limits on the routes that need no token (relay/src/front.ts), counted by Cloudflare for
# every instance of the Worker in a location, before any Durable Object is reached. A namespace_id
# must be unique in your account: change these if another Worker of yours uses them.
[[ratelimits]]
name = "ANONYMOUS_PER_ADDRESS"
namespace_id = "40871"

[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "ANONYMOUS_ALL"
namespace_id = "40872"

[ratelimits.simple]
limit = 20
period = 60
